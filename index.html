<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дурак</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#06150f;
}

button{
  font:inherit;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:650px;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 48%,
      #1b6847 0,
      #104a34 38%,
      #0a3022 70%,
      #061911 100%
    );
}

.game::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.14;
  pointer-events:none;

  background-image:
    repeating-linear-gradient(
      35deg,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 4px
    ),
    repeating-linear-gradient(
      -35deg,
      rgba(0,0,0,.04) 0 1px,
      transparent 1px 5px
    );
}

.game::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle,
      transparent 46%,
      rgba(0,0,0,.2)
    );
}


/* =========================
   HEADER
========================= */

.header{
  position:absolute;
  top:18px;
  left:24px;
  right:24px;

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  z-index:100;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:2px;
}

.logo small{
  display:block;
  margin-top:3px;

  color:#e6ca7d;

  font-size:9px;
  letter-spacing:4px;
}

.status-wrap{
  display:flex;
  gap:8px;
}

.pill{
  padding:10px 15px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:rgba(6,26,18,.75);

  backdrop-filter:blur(8px);

  font-size:12px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.18);
}


/* =========================
   TURN BANNER
========================= */

.turn-banner{
  position:absolute;

  left:50%;
  top:29%;

  min-width:220px;

  padding:10px 18px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;

  background:rgba(4,24,16,.88);

  transform:
    translateX(-50%)
    translateY(7px);

  opacity:0;

  text-align:center;

  font-size:13px;
  font-weight:800;

  box-shadow:
    0 10px 30px rgba(0,0,0,.26);

  backdrop-filter:blur(8px);

  pointer-events:none;

  transition:
    opacity .24s ease,
    transform .24s ease;

  z-index:130;
}

.turn-banner.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

.turn-banner .actor{
  color:#e8c975;
}


/* =========================
   OPPONENTS
========================= */

.opponent{
  position:absolute;

  min-width:155px;

  text-align:center;

  z-index:40;
}

.opponent.top{
  left:50%;
  top:57px;

  transform:translateX(-50%);
}

.opponent.left{
  left:35px;
  top:34%;

  transform:translateY(-50%);
}

.opponent.right{
  right:35px;
  top:34%;

  transform:translateY(-50%);
}

.opponent-name{
  display:inline-flex;
  align-items:center;
  gap:7px;

  margin-bottom:7px;
  padding:7px 11px;

  border:1px solid transparent;
  border-radius:18px;

  background:rgba(3,18,12,.68);

  font-size:11px;

  transition:
    transform .22s ease,
    background .22s ease,
    border-color .22s ease,
    box-shadow .22s ease;
}

.opponent-name.attacker{
  color:#1d261f;
  background:#e8c975;
}

.opponent-name.defender{
  border-color:#e8c975;

  box-shadow:
    0 0 0 2px rgba(232,201,117,.12);
}

.opponent-name.acting{
  transform:scale(1.07);

  border-color:rgba(255,255,255,.8);

  box-shadow:
    0 0 0 4px rgba(255,255,255,.07),
    0 8px 25px rgba(0,0,0,.28);
}

.opponent-count{
  opacity:.65;
  font-size:10px;
}

.bot-hand{
  position:relative;

  width:180px;
  height:84px;

  margin:auto;
}

.bot-hand .card{
  position:absolute;

  left:50%;
  top:0;

  width:58px;
  height:81px;

  transform:
    translate3d(
      calc(-50% + var(--x)),
      0,
      0
    )
    rotate(var(--r));

  will-change:transform;

  transition:
    transform .38s cubic-bezier(.22,.78,.22,1),
    opacity .22s ease;
}


/* =========================
   CARD
========================= */

.card{
  position:relative;

  width:82px;
  height:116px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  border:1px solid #cec6b9;
  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      #fffefa,
      #eee8de
    );

  color:#171717;

  font-size:31px;
  font-weight:700;

  box-shadow:
    0 10px 23px rgba(0,0,0,.43);

  user-select:none;

  transform-origin:center center;

  backface-visibility:hidden;
}

.card.red{
  color:#c92735;
}

.corner{
  position:absolute;

  left:8px;
  top:7px;

  font-size:16px;
  line-height:15px;

  text-align:center;
}

.corner span{
  display:block;
}

.corner.bottom{
  left:auto;
  top:auto;

  right:8px;
  bottom:7px;

  transform:rotate(180deg);
}

.card.back{
  border:5px solid #eee8dc;

  background:
    repeating-linear-gradient(
      45deg,
      #173b67 0 5px,
      #eee6d8 5px 8px,
      #942b36 8px 13px,
      #eee6d8 13px 16px
    );
}


/* =========================
   PLAYER
========================= */

.player-area{
  position:absolute;

  left:50%;
  bottom:0;

  width:94vw;
  height:180px;

  transform:translateX(-50%);

  z-index:60;
}

.player-name{
  position:absolute;

  left:50%;
  bottom:150px;

  padding:6px 12px;

  border:1px solid transparent;
  border-radius:15px;

  background:rgba(3,18,12,.64);

  transform:translateX(-50%);

  font-size:11px;

  transition:.2s ease;
}

.player-name.attacker{
  color:#1d261f;
  background:#e8c975;
}

.player-name.defender{
  border-color:#e8c975;
}

.player-hand{
  position:absolute;

  left:50%;
  bottom:-8px;

  width:1px;
  height:145px;
}

.player-hand .card{
  position:absolute;

  left:0;
  top:20px;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    )
    rotate(var(--r));

  will-change:transform;

  transition:
    transform .38s cubic-bezier(.22,.78,.22,1),
    opacity .2s ease,
    filter .2s ease,
    box-shadow .2s ease;
}

.player-hand .card.playable{
  cursor:pointer;
}

.player-hand .card.playable:hover{
  z-index:200!important;

  transform:
    translate3d(
      var(--x),
      calc(var(--y) - 17px),
      0
    )
    rotate(var(--r))
    scale(1.035);

  box-shadow:
    0 19px 34px rgba(0,0,0,.55);
}

.player-hand .card.disabled{
  opacity:.62;

  filter:brightness(.82);
}


/* =========================
   TABLE
========================= */

.table{
  position:absolute;

  left:50%;
  top:49%;

  width:min(690px,58vw);
  height:330px;

  transform:translate(-50%,-50%);

  display:grid;

  grid-template-columns:
    repeat(3,120px);

  grid-auto-rows:150px;

  justify-content:center;
  align-content:center;

  gap:4px 25px;

  z-index:20;
}

.pair{
  position:relative;

  width:120px;
  height:145px;

  transform:
    translate3d(
      var(--jx),
      var(--jy),
      0
    )
    rotate(var(--jr));
}

.pair .card{
  position:absolute;

  left:0;
  top:0;
}

.pair .defense{
  left:30px;
  top:27px;

  transform:rotate(8deg);
}


/* =========================
   DECK
========================= */

.deck-zone{
  position:absolute;

  left:6%;
  top:55%;

  width:175px;
  height:160px;

  transform:translateY(-50%);

  z-index:30;
}

.deck-back{
  position:absolute;

  left:0;
  top:12px;

  z-index:5;
}

.deck-trump{
  position:absolute;

  left:38px;
  top:12px;

  z-index:2;

  transform:rotate(90deg);
}

.deck-count{
  position:absolute;

  left:3px;
  top:139px;

  font-size:11px;
  color:#c3cfc8;
}

.trump-symbol{
  position:absolute;

  left:110px;
  top:47px;

  font-size:34px;
}


/* =========================
   DISCARD
========================= */

.discard{
  position:absolute;

  right:7%;
  bottom:24%;

  width:95px;
  height:115px;

  opacity:.85;
}

.discard-card{
  position:absolute;

  left:15px;
  top:5px;

  width:64px;
  height:89px;

  border:4px solid #eee8dc;
  border-radius:9px;

  background:
    repeating-linear-gradient(
      45deg,
      #173b67 0 5px,
      #eee6d8 5px 8px,
      #942b36 8px 13px,
      #eee6d8 13px 16px
    );

  box-shadow:
    0 7px 17px rgba(0,0,0,.3);
}

.discard-card:nth-child(1){
  transform:rotate(-6deg);
}

.discard-card:nth-child(2){
  transform:rotate(5deg);
}

.discard-card:nth-child(3){
  transform:rotate(-1deg);
}

.discard-label{
  position:absolute;

  left:0;
  right:0;
  bottom:-2px;

  text-align:center;

  font-size:9px;
  letter-spacing:1.5px;

  color:#aab8b1;
}


/* =========================
   ACTIONS
========================= */

.action{
  position:absolute;

  right:6%;
  top:51%;

  display:flex;
  flex-direction:column;
  gap:8px;

  z-index:80;
}

.action button{
  min-width:110px;

  padding:11px 17px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;

  background:#eee9df;
  color:#18241e;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 7px 18px rgba(0,0,0,.25);

  transition:
    transform .12s ease,
    filter .12s ease;
}

.action button:hover{
  transform:translateY(-2px);

  filter:brightness(1.05);
}

.action button.red{
  color:#fff;

  background:#96323d;
}

.hidden{
  display:none!important;
}


/* =========================
   FLYING CARD
========================= */

.flying-card{
  position:fixed!important;

  margin:0!important;

  pointer-events:none!important;

  z-index:3000!important;

  will-change:transform;

  backface-visibility:hidden;

  contain:layout paint style;

  box-shadow:
    0 18px 38px rgba(0,0,0,.48)!important;
}


/* =========================
   MENU
========================= */

.overlay{
  position:fixed;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:500;

  background:
    radial-gradient(
      circle at 50% 40%,
      #15452f,
      #061a12
    );
}

.menu{
  width:460px;

  padding:32px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:rgba(10,35,24,.97);

  box-shadow:
    0 30px 80px rgba(0,0,0,.5);
}

.menu h1{
  margin:0;

  font-size:46px;
  letter-spacing:3px;
}

.menu-sub{
  margin:6px 0 24px;

  color:#9fb0a7;
}

.setting{
  margin-top:18px;
}

.setting-title{
  margin-bottom:8px;

  color:#9fb0a7;

  font-size:11px;
  letter-spacing:1px;

  text-transform:uppercase;
}

.choice{
  display:grid;
  gap:7px;
}

.choice.two{
  grid-template-columns:
    repeat(2,1fr);
}

.choice.three{
  grid-template-columns:
    repeat(3,1fr);
}

.choice button{
  padding:11px 7px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:9px;

  background:#133627;
  color:#dbe5df;

  font-weight:800;

  cursor:pointer;
}

.choice button.active{
  border-color:#e8c975;

  background:#e8c975;
  color:#1e271f;
}

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;

  margin-top:20px;
}

.stat{
  padding:9px;

  border-radius:9px;

  background:rgba(255,255,255,.035);

  text-align:center;
}

.stat b{
  display:block;

  font-size:18px;
}

.stat span{
  color:#97a89f;

  font-size:9px;

  text-transform:uppercase;
}

.start-button{
  width:100%;

  margin-top:20px;
  padding:14px;

  border:0;
  border-radius:11px;

  background:#e8c975;
  color:#1c251f;

  font-weight:900;

  cursor:pointer;
}


/* =========================
   RESULT
========================= */

.result{
  width:390px;

  padding:32px;

  border-radius:23px;

  background:#f2ede3;
  color:#17201b;

  text-align:center;

  box-shadow:
    0 30px 90px rgba(0,0,0,.5);
}

.result-icon{
  font-size:45px;
}

.result h2{
  margin:7px 0;

  font-size:31px;
}

.result p{
  color:#665f55;
}

.result button{
  width:100%;

  padding:13px;

  border:0;
  border-radius:10px;

  background:#174b35;
  color:#fff;

  font-weight:900;

  cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .card{
    width:64px;
    height:91px;

    font-size:24px;
  }

  .corner{
    font-size:13px;
    line-height:12px;
  }

  .table{
    width:48vw;

    grid-template-columns:
      repeat(2,90px);

    grid-auto-rows:115px;
  }

  .pair{
    width:90px;
    height:115px;
  }

  .pair .defense{
    left:22px;
    top:20px;
  }

  .deck-zone{
    left:1%;

    transform:
      translateY(-50%)
      scale(.78);

    transform-origin:left center;
  }

  .opponent.left{
    left:5px;
  }

  .opponent.right{
    right:5px;
  }

  .bot-hand{
    transform:scale(.8);
  }

  .discard{
    right:1%;

    transform:scale(.8);
  }

  .action{
    right:1%;
  }

  .memory{
    display:none;
  }

  .menu{
    width:min(94vw,460px);
  }

  .turn-banner{
    top:29%;

    min-width:185px;

    font-size:12px;
  }
}
</style>
</head>


<body>

<div class="game">

  <div class="header">

    <div class="logo">
      ДУРАК
      <small id="modeLabel">
        ПОДКИДНОЙ
      </small>
    </div>

    <div class="status-wrap">

      <div
        class="pill memory"
        id="memory"
      >
        Вышло: 0
      </div>

      <div
        class="pill"
        id="status"
      >
        Игра
      </div>

    </div>

  </div>


  <div
    class="turn-banner"
    id="turnBanner"
  ></div>


  <div id="opponents"></div>


  <div class="deck-zone">

    <div
      class="deck-trump"
      id="deckTrump"
    ></div>

    <div
      class="deck-back"
      id="deckBack"
    ></div>

    <div
      class="deck-count"
      id="deckCount"
    ></div>

    <div
      class="trump-symbol"
      id="trumpSymbol"
    ></div>

  </div>


  <div
    class="table"
    id="table"
  ></div>


  <div
    class="discard"
    id="discard"
  ></div>


  <div class="action">

    <button
      id="takeButton"
      class="red hidden"
    >
      Забрать
    </button>

    <button
      id="passButton"
      class="hidden"
    >
      Пас
    </button>

  </div>


  <div class="player-area">

    <div
      class="player-name"
      id="playerName"
    >
      Ты
    </div>

    <div
      class="player-hand"
      id="playerHand"
    ></div>

  </div>

</div>


<div
  class="overlay"
  id="startOverlay"
>

  <div class="menu">

    <h1>ДУРАК</h1>

    <div class="menu-sub">
      Настрой партию
    </div>


    <div class="setting">

      <div class="setting-title">
        Режим
      </div>

      <div class="choice two">

        <button
          data-mode="throw"
          class="active"
        >
          Подкидной
        </button>

        <button
          data-mode="transfer"
        >
          Переводной
        </button>

      </div>

    </div>


    <div class="setting">

      <div class="setting-title">
        Соперники
      </div>

      <div class="choice three">

        <button
          data-opponents="1"
          class="active"
        >
          1
        </button>

        <button
          data-opponents="2"
        >
          2
        </button>

        <button
          data-opponents="3"
        >
          3
        </button>

      </div>

    </div>


    <div class="setting">

      <div class="setting-title">
        Сложность
      </div>

      <div class="choice three">

        <button
          data-difficulty="easy"
        >
          Легко
        </button>

        <button
          data-difficulty="medium"
          class="active"
        >
          Средне
        </button>

        <button
          data-difficulty="hard"
        >
          Сложно
        </button>

      </div>

    </div>


    <div class="stats">

      <div class="stat">

        <b id="wins">
          0
        </b>

        <span>
          Победы
        </span>

      </div>

      <div class="stat">

        <b id="losses">
          0
        </b>

        <span>
          Поражения
        </span>

      </div>

      <div class="stat">

        <b id="rate">
          0%
        </b>

        <span>
          Винрейт
        </span>

      </div>

    </div>


    <button
      class="start-button"
      id="startButton"
    >
      Начать игру
    </button>

  </div>

</div>


<div
  class="overlay hidden"
  id="resultOverlay"
>

  <div class="result">

    <div
      class="result-icon"
      id="resultIcon"
    ></div>

    <h2 id="resultTitle"></h2>

    <p id="resultText"></p>

    <button id="againButton">
      Играть ещё
    </button>

  </div>

</div>


<script>

/* =========================================
   CONSTANTS
========================================= */

const suits=[
  "♠",
  "♥",
  "♦",
  "♣"
];

const suitOrder=[
  "♣",
  "♦",
  "♥",
  "♠"
];

const ranks=[
  "6",
  "7",
  "8",
  "9",
  "10",
  "J",
  "Q",
  "K",
  "A"
];


const BOT_NAMES=[

  "Макс",
  "Артём",
  "Рома",
  "Антон",
  "Кирилл",
  "Дима",
  "Илья",
  "Никита",
  "Денис",
  "Миша",
  "Андрей",
  "Серёга",
  "Лёха",
  "Вадим",
  "Олег",
  "Саша",
  "Женя",
  "Глеб",
  "Стас",
  "Егор",
  "Паша",
  "Тимур",
  "Витя",
  "Ярик"

];


const BOT_STYLES=[
  "careful",
  "normal",
  "aggressive"
];


const AI_SPEED={

  easy:{
    think:1700,
    after:850
  },

  medium:{
    think:1400,
    after:760
  },

  hard:{
    think:1150,
    after:680
  }

};


const $=
  id=>
    document.getElementById(id);


const sleep=
  ms=>
    new Promise(
      resolve=>
        setTimeout(
          resolve,
          ms
        )
    );


/* =========================================
   SETTINGS
========================================= */

let gameMode="throw";

let opponentCount=1;

let difficulty="medium";


/* =========================================
   STATE
========================================= */

let players=[];

let deck=[];

let trump=null;

let bottomTrump=null;

let table=[];

let discardCount=0;

let attacker=0;

let defender=1;

let roundStartAttacker=0;

let defenderStartCards=6;

let phase="attack";

let currentThrower=0;

let passed=new Set();

let locked=false;

let gameOver=false;

let seenCards=new Set();

let humanSafe=false;

let actingPlayer=null;

let actingText="";


/* =========================================
   STATS
========================================= */

let stats={
  wins:0,
  losses:0
};


try{

  stats={
    ...stats,
    ...JSON.parse(
      localStorage.getItem(
        "durakMultiStats"
      )
      ||
      "{}"
    )
  };

}catch(error){}


function saveStats(){

  localStorage.setItem(

    "durakMultiStats",

    JSON.stringify(
      stats
    )

  );


  renderStats();

}


function renderStats(){

  $("wins")
    .textContent=
      stats.wins;


  $("losses")
    .textContent=
      stats.losses;


  const total=

    stats.wins
    +
    stats.losses;


  $("rate")
    .textContent=

      (
        total

          ?

            Math.round(
              stats.wins
              /
              total
              *
              100
            )

          :

            0
      )

      +

      "%";

}


/* =========================================
   BASIC
========================================= */

function isRed(suit){

  return (
    suit==="♥"
    ||
    suit==="♦"
  );

}


function value(card){

  return ranks.indexOf(
    card.rank
  );

}


function shuffle(array){

  const copy=[
    ...array
  ];


  for(
    let i=copy.length-1;
    i>0;
    i--
  ){

    const j=

      Math.floor(
        Math.random()
        *
        (
          i+1
        )
      );


    [
      copy[i],
      copy[j]
    ]

    =

    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}


function createDeck(){

  const result=[];

  let id=0;


  for(
    const suit
    of suits
  ){

    for(
      const rank
      of ranks
    ){

      result.push({

        suit,

        rank,

        id:
          "c"+id++

      });

    }

  }


  return result;

}


function removeCard(
  hand,
  id
){

  const index=

    hand.findIndex(
      card=>
        card.id===id
    );


  if(
    index<0
  ){

    return null;

  }


  return hand.splice(
    index,
    1
  )[0];

}


function activePlayers(){

  return players.filter(
    player=>
      player.active
  );

}


function activeCount(){

  return activePlayers()
    .length;

}


function nextActive(index){

  if(
    activeCount()<=1
  ){

    return index;

  }


  let current=
    index;


  for(
    let i=0;
    i<players.length+2;
    i++
  ){

    current=

      (
        current+1
      )

      %

      players.length;


    if(
      players[current]
        .active
    ){

      return current;

    }

  }


  return index;

}


function cycleFrom(start){

  const result=[];

  let current=start;


  for(
    let i=0;
    i<players.length;
    i++
  ){

    if(
      players[current]
        .active
    ){

      result.push(
        current
      );

    }


    current=

      (
        current+1
      )

      %

      players.length;

  }


  return result;

}

function randomBotStyle(){

/* =========================================
   TABLE RULES
========================================= */

function tableRanks(){

  const result=[];


  for(
    const pair
    of table
  ){

    result.push(
      pair.attack.rank
    );


    if(
      pair.defense
    ){

      result.push(
        pair.defense.rank
      );

    }

  }


  return result;

}


function unresolvedPair(){

  return table.find(
    pair=>
      !pair.defense
  );

}


function allDefended(){

  return (

    table.length>0

    &&

    !unresolvedPair()

  );

}


function maxAttacks(){

  return Math.min(

    6,

    defenderStartCards

  );

}


function canThrow(card){

  if(
    table.length>=
      maxAttacks()
  ){

    return false;

  }


  if(
    !table.length
  ){

    return true;

  }


  return tableRanks()
    .includes(
      card.rank
    );

}


function beats(
  defenseCard,
  attackCard
){

  if(
    defenseCard.suit===
      attackCard.suit

    &&

    value(defenseCard)>
      value(attackCard)
  ){

    return true;

  }


  if(
    defenseCard.suit===
      trump

    &&

    attackCard.suit!==
      trump
  ){

    return true;

  }


  return false;

}


/* =========================================
   TRANSFER
========================================= */

function canTransfer(
  playerIndex,
  card
){

  if(
    gameMode!=="transfer"
    ||
    playerIndex!==defender
    ||
    phase!=="defense"
  ){

    return false;

  }


  if(
    table.some(
      pair=>
        pair.defense
    )
  ){

    return false;

  }


  if(
    !table.length
  ){

    return false;

  }


  if(
    card.rank!==
      table[0].attack.rank
  ){

    return false;

  }


  if(
    table.length>=6
  ){

    return false;

  }


  const next=
    nextActive(
      defender
    );


  if(
    next===defender
  ){

    return false;

  }


  return (

    players[next]
      .hand
      .length

    >=

    table.length+1

  );

}

========================================= */

function sortedHumanHand(){

  return [
    ...players[0].hand
  ]
  .sort(
    (
      a,
      b
    )=>{

      const aTrump=
        a.suit===trump;


      const bTrump=
        b.suit===trump;


      if(
        aTrump!==bTrump
      ){

        return (
          aTrump
            ?1
            :-1
        );

      }


      if(
        value(a)!==
        value(b)
      ){

        return (
          value(a)
          -
          value(b)
        );

      }


      return (

        suitOrder.indexOf(
          a.suit
        )

        -

        suitOrder.indexOf(
          b.suit
        )

      );

    }
  );

}


function humanLayout(cards){

  const total=
    cards.length;


  const cardWidth=

    window.innerWidth<850

      ?

        64

      :

        82;


  const maxWidth=

    Math.min(
      window.innerWidth*.88,
      1000
    );


  const step=

    total<=1

      ?

        0

      :

        Math.max(

          17,

          Math.min(

            57,

            (
              maxWidth-cardWidth
            )
            /
            (
              total-1
            )

          )

        );


  const width=

    cardWidth

    +

    (
      total-1
    )
    *
    step;


  return cards.map(
    (
      card,
      index
    )=>{

      const relative=

        index

        -

        (
          total-1
        )
        /
        2;


      const strength=

        total>14

          ?.7

          :

        total>10

          ?1.05

          :

        total>7

          ?1.55

          :

            2.2;


      return{

        card,

        x:

          -
          width/2

          +

          index
          *
          step,

        y:

          Math.abs(
            relative
          )

          *

          (
            total>12
              ?.55
              :1.4
          ),

        r:

          Math.max(

            -11,

            Math.min(
              11,
              relative
              *
              strength
            )

          ),

        z:
          index+1

      };

    }
  );

}


function canHumanPlay(card){

  if(
    locked
    ||
    gameOver
    ||
    !players[0].active
  ){

    return false;

  }


  if(
    defender===0
    &&
    phase==="defense"
  ){

    if(
      canTransfer(
        0,
        card
      )
    ){

      return true;

    }


    const pair=
      unresolvedPair();


    return (

      !!pair

      &&

      beats(
        card,
        pair.attack
      )

    );

  }


  if(
    phase==="attack"
    &&
    currentThrower===0
    &&
    defender!==0
  ){

    return canThrow(
      card
    );

  }


  return false;

}

/* =========================================
   NEW GPU ANIMATION ENGINE
========================================= */

function createFlyingClone(
  source
){

  const rect=

    source
      .getBoundingClientRect();


  const clone=

    source.cloneNode(
      true
    );


  clone.classList.add(
    "flying-card"
  );


  clone.style.left=
    rect.left+"px";


  clone.style.top=
    rect.top+"px";


  clone.style.width=
    rect.width+"px";


  clone.style.height=
    rect.height+"px";


  clone.style.transform=
    "translate3d(0,0,0)";


  document.body
    .appendChild(
      clone
    );


  return{

    clone,

    rect

  };

}


async function animateCardFlight(
  source,
  target,
  options={}
){

  if(
    !source
    ||
    !target
  ){

    return;

  }


  const duration=
    options.duration
    ??
    620;


  const rotation=
    options.rotation
    ??
    5;


  const arc=
    options.arc
    ??
    70;


  const targetScale=
    options.scale
    ??
    1;


  const {

    clone,

    rect:from

  }=
    createFlyingClone(
      source
    );


  /*
    Оригинальную карту
    прячем на время полёта,
    чтобы не было дубля.
  */

  source.style.visibility=
    "hidden";


  const to=

    target
      .getBoundingClientRect();


  const dx=

    to.left

    +

    to.width/2

    -

    from.width/2

    -

    from.left;


  const dy=

    to.top

    +

    to.height/2

    -

    from.height/2

    -

    from.top;


  const midX=
    dx*.52;


  const midY=

    dy*.46

    -

    arc;


  const animation=

    clone.animate(

      [

        {

          transform:
            "translate3d(0,0,0) rotate(0deg) scale(1)",

          offset:0

        },

        {

          transform:
            `translate3d(
              ${dx*.07}px,
              -10px,
              0
            )
            rotate(${rotation*.08}deg)
            scale(1.025)`,

          offset:.13

        },

        {

          transform:
            `translate3d(
              ${midX}px,
              ${midY}px,
              0
            )
            rotate(${rotation*.55}deg)
            scale(1.035)`,

          offset:.55

        },

        {

          transform:
            `translate3d(
              ${dx}px,
              ${dy-4}px,
              0
            )
            rotate(${rotation}deg)
            scale(${targetScale})`,

          offset:.92

        },

        {

          transform:
            `translate3d(
              ${dx}px,
              ${dy}px,
              0
            )
            rotate(${rotation}deg)
            scale(${targetScale})`,

          offset:1

        }

      ],

      {

        duration,

        easing:
          "cubic-bezier(.21,.72,.24,1)",

        fill:
          "forwards"

      }

    );


  try{

    await animation.finished;

  }

  catch(error){}


  clone.remove();


  source.style.visibility=
    "";

}


/* =========================================

async function animateTableToTarget(
  target
){

  const cards=

    [
      ...
      document.querySelectorAll(
        "#table .card"
      )
    ];


  if(
    !cards.length
  ){

    return;

  }


  const jobs=[];


  cards.forEach(
    (
      card,
      index
    )=>{

      jobs.push(

        new Promise(
          resolve=>{

            setTimeout(
              async()=>{

                await animateCardFlight(

                  card,

                  target,

                  {

                    duration:480,

                    arc:42,

                    rotation:
                      (
                        index%2
                          ?7
                          :-7
                      ),

                    scale:.72

                  }

                );


                resolve();

              },

              index*55

            );

          }
        )

      );

    }
  );


  await Promise.all(
    jobs
  );

}

function cheapest(

){

  return [
    ...cards
  ]
  .sort(
    (
      a,
      b
    )=>{

      if(
        avoidTrump
      ){

        const aTrump=
          a.suit===trump;


        const bTrump=
          b.suit===trump;


        if(
          aTrump!==bTrump
        ){

          return (
            aTrump
              ?1
              :-1
          );

        }

      }


      return (
        value(a)
        -
        value(b)
      );

    }
  )[0];

}


function chooseAIAttack(
  playerIndex,
  cards
){

  const bot=
    players[playerIndex];


  if(
    difficulty==="easy"
  ){

    return cheapest(
      cards,
      false
    );

  }


  return [
    ...cards
  ]
  .sort(
    (
      a,
      b
    )=>{

      function score(card){

        let result=
          value(card)*2;


        if(
          card.suit===trump
        ){

          result+=

            difficulty==="hard"

              ?25

              :18;

        }


        const same=

          bot.hand.filter(
            item=>
              item.rank===
              card.rank
          )
          .length;


        result-=

          (
            same-1
          )
          *
          4;


        if(
          bot.style==="aggressive"
        ){

          result-=2;

        }


        if(
          bot.style==="careful"
          &&
          card.suit===trump
        ){

          result+=5;

        }


        return result;

      }


      return (
        score(a)
        -
        score(b)
      );

    }
  )[0];

}


function chooseAIDefense(
  playerIndex,
  attackCard
){

  const options=

    players[playerIndex]
      .hand
      .filter(
        card=>
          beats(
            card,
            attackCard
          )
      );


  if(
    !options.length
  ){

    return null;

  }


  if(
    difficulty==="easy"
  ){

    return cheapest(
      options,
      false
    );

  }


  return cheapest(
    options,
    true
  );

}


function aiWantsTransfer(
  playerIndex,
  card
){

  const bot=
    players[playerIndex];


  if(
    gameMode!=="transfer"
    ||
    difficulty==="easy"
  ){

    return false;

  }


  if(
    !canTransfer(
      playerIndex,
      card
    )
  ){

    return false;

  }


  if(
    bot.style==="aggressive"
  ){

    return true;

  }


  if(
    bot.style==="careful"
    &&
    card.suit===trump
  ){

    return false;

  }


  return (
    difficulty==="hard"
    ||
    card.suit!==trump
  );

}


/* =========================================
   ROUND
========================================= */

function findLowestTrumpPlayer(){

  let winner=null;

  let best=999;


  players.forEach(
    (
      player,
      index
    )=>{

      const trumps=

        player.hand.filter(
          card=>
            card.suit===trump
        );


      if(
        !trumps.length
      ){

        return;

      }


      const low=

        Math.min(
          ...trumps.map(
            value
          )
        );


      if(
        low<best
      ){

        best=
          low;


        winner=
          index;

      }

    }
  );


  return (

    winner===null

      ?

        0

      :

        winner

  );

}


function startRound(
  newAttacker
){

  attacker=
    newAttacker;


  defender=

    nextActive(
      attacker
    );


  roundStartAttacker=
    attacker;


  defenderStartCards=

    players[defender]
      .hand
      .length;


  table=[];


  phase=
    "attack";


  passed=
    new Set();


  currentThrower=
    attacker;


  locked=
    false;


  actingPlayer=
    null;


  actingText="";


  render();


  scheduleCurrentAction();

}


/* =========================================
   THROWERS
========================================= */

function eligibleThrowers(){

  return cycleFrom(
    roundStartAttacker
  )
  .filter(
    index=>

      index!==defender

      &&

      players[index]
        .active
  );

}


function nextThrowerAfter(
  current
){

  const list=
    eligibleThrowers();


  const index=

    list.indexOf(
      current
    );


  if(
    index<0
  ){

    return list[0];

  }


  return list[
    (
      index+1
    )
    %
    list.length
  ];

}


function allThrowersPassed(){

  return eligibleThrowers()
    .every(
      index=>
        passed.has(
          index
        )
    );

}


function moveToNextThrower(){

  if(
    table.length>=
      maxAttacks()
    ||
    allThrowersPassed()
  ){

    finishSuccessfulDefense();

    return;

  }


  let next=

    nextThrowerAfter(
      currentThrower
    );


  let safety=0;


  while(
    passed.has(next)
    &&
    safety<
      players.length+2
  ){

    next=
      nextThrowerAfter(
        next
      );


    safety++;

  }


  currentThrower=
    next;


  phase=
    "attack";


  render();


  scheduleCurrentAction();

}


/* =========================================
   ATTACK
========================================= */

async function playAttackCard(
  playerIndex,
  card
){

  if(
    locked
    ||
    phase!=="attack"
    ||
    currentThrower!==playerIndex
    ||
    !canThrow(card)
  ){

    return;

  }


  locked=
    true;


  renderButtons();


  if(
    playerIndex!==0
  ){

    setActionCue(

      playerIndex,

      table.length

        ?

          " подкидывает"

        :

          " ходит"

    );


    await sleep(
      300
    );

  }


  const source=

    getCardElement(
      playerIndex,
      card.id
    );


  /*
    ВАЖНО:
    пока летит карта,
    render() не вызывается.
  */

  if(source){

    await animateCardFlight(

      source,

      $("table"),

      {

        duration:620,

        arc:
          playerIndex===0
            ?58
            :78,

        rotation:
          playerIndex===0
            ?4
            :-5

      }

    );

  }


  const played=

    removeCard(

      players[playerIndex]
        .hand,

      card.id

    );


  seenCards.add(
    played.id
  );


  table.push({

    attack:
      played,

    defense:null,

    by:
      playerIndex

  });


  passed=
    new Set();


  phase=
    "defense";


  /*
    Только сейчас
    перерисовываем интерфейс.
  */

  render();


  if(
    playerIndex!==0
  ){

    await sleep(

      AI_SPEED[
        difficulty
      ].after

    );


    clearActionCue();

  }


  locked=
    false;


  renderButtons();


  scheduleCurrentAction();

}


/* =========================================
   DEFENSE
========================================= */

async function defendWith(
  playerIndex,
  card
){

  if(
    locked
    ||
    playerIndex!==defender
    ||
    phase!=="defense"
  ){

    return;

  }


  const pair=
    unresolvedPair();


  if(
    !pair
  ){

    return;

  }


  if(
    canTransfer(
      playerIndex,
      card
    )
  ){

    await transferAttack(
      playerIndex,
      card
    );


    return;

  }


  if(
    !beats(
      card,
      pair.attack
    )
  ){

    return;

  }


  locked=
    true;


  renderButtons();


  if(
    playerIndex!==0
  ){

    setActionCue(

      playerIndex,

      " отбивается"

    );


    await sleep(
      280
    );

  }


  const source=

    getCardElement(
      playerIndex,
      card.id
    );


  if(source){

    await animateCardFlight(

      source,

      $("table"),

      {

        duration:600,

        arc:62,

        rotation:
          playerIndex===0
            ?5
            :-5

      }

    );

  }


  pair.defense=

    removeCard(

      players[playerIndex]
        .hand,

      card.id

    );


  seenCards.add(
    pair.defense.id
  );


  if(
    unresolvedPair()
  ){

    phase=
      "defense";

  }

  else{

    phase=
      "attack";


    currentThrower=
      roundStartAttacker;

  }


  render();


  if(
    playerIndex!==0
  ){

    await sleep(

      AI_SPEED[
        difficulty
      ].after

    );


    clearActionCue();

  }


  locked=
    false;


  renderButtons();


  scheduleCurrentAction();

}

/* =========================================
   TAKE CARDS
========================================= */

async function defenderTakes(){

  if(
    locked
    ||
    phase!=="defense"
  ){

    return;

  }


  locked=
    true;


  renderButtons();


  const oldDefender=
    defender;


  if(
    oldDefender!==0
  ){

    setActionCue(

      oldDefender,

      " забирает"

    );


    await sleep(
      400
    );

  }


  const target=

    oldDefender===0

      ?

        $("playerHand")

      :

        document.querySelector(

          `.opponent
          [data-player-index="${oldDefender}"]
          .bot-hand`

        );


  /*
    Теперь карты реально
    улетают со стола в руку.
  */

  if(target){

    await animateTableToTarget(
      target
    );

  }


  for(
    const pair
    of table
  ){

    players[oldDefender]
      .hand
      .push(
        pair.attack
      );


    if(
      pair.defense
    ){

      players[oldDefender]
        .hand
        .push(
          pair.defense
        );

    }

  }


  table=[];


  render();


  await refillRound(
    oldDefender
  );


  removeFinishedPlayers();


  if(
    checkEndGame()
  ){

    return;

  }


  clearActionCue();


  startRound(

    nextActive(
      oldDefender
    )

  );

}


/* =========================================
   SUCCESSFUL DEFENSE
========================================= */

async function finishSuccessfulDefense(){

  if(
    locked
    ||
    !allDefended()
  ){

    return;

  }


  locked=
    true;


  renderButtons();


  const oldDefender=
    defender;


  const tableCards=

    table.reduce(
      (
        total,
        pair
      )=>

        total

        +

        1

        +

        (
          pair.defense
            ?1
            :0
        ),

      0
    );


  await animateTableToTarget(
    $("discard")
  );


  discardCount+=
    tableCards;


  table=[];


  render();


  await refillRound(
    oldDefender
  );


  removeFinishedPlayers();


  if(
    checkEndGame()
  ){

    return;

  }


  if(
    players[oldDefender]
      .active
  ){

    startRound(
      oldDefender
    );

  }

  else{

    startRound(

      nextActive(
        oldDefender
      )

    );

  }

}


/* =========================================
   DRAW ANIMATION
========================================= */

async function drawOneCard(
  playerIndex
){

  if(
    !deck.length
  ){

    return false;

  }


  const source=

    $("deckBack")
      .querySelector(
        ".card"
      )

    ||

    $("deckTrump")
      .querySelector(
        ".card"
      );


  const target=

    playerIndex===0

      ?

        $("playerHand")

      :

        document.querySelector(

          `.opponent
          [data-player-index="${playerIndex}"]
          .bot-hand`

        );


  const card=
    deck[0];


  if(
    source
    &&
    target
  ){

    await animateCardFlight(

      source,

      target,

      {

        duration:420,

        arc:38,

        rotation:
          playerIndex===0
            ?3
            :-3,

        scale:.72

      }

    );

  }


  deck.shift();


  players[playerIndex]
    .hand
    .push(
      card
    );


  render();


  return true;

}


async function refillRound(
  finalDefender
){

  const order=

    cycleFrom(
      roundStartAttacker
    )
    .filter(
      index=>
        index!==finalDefender
    );


  order.push(
    finalDefender
  );


  for(
    const playerIndex
    of order
  ){

    if(
      !players[playerIndex]
        .active
    ){

      continue;

    }


    while(
      players[playerIndex]
        .hand
        .length<6

      &&

      deck.length
    ){

      await drawOneCard(
        playerIndex
      );


      await sleep(
        70
      );

    }

  }


  await sleep(
    250
  );

}


/* =========================================
   FINISHED PLAYERS
========================================= */

function removeFinishedPlayers(){

  if(
    deck.length
  ){

    return;

  }


  players.forEach(
    (
      player,
      index
    )=>{

      if(
        player.active
        &&
        player.hand.length===0
      ){

        player.active=
          false;


        if(
          index===0
        ){

          humanSafe=
            true;

        }

      }

    }
  );

}


/* =========================================
   GAME END
========================================= */

function checkEndGame(){

  if(
    humanSafe
  ){

    gameOver=
      true;


    stats.wins++;


    saveStats();


    showResult(

      true,

      "Ты вышел из игры",

      "Карты закончились. Ты не дурак."

    );


    return true;

  }


  const active=
    activePlayers();


  if(
    active.length<=1
  ){

    gameOver=
      true;


    if(
      active.length===1
      &&
      active[0].human
    ){

      stats.losses++;


      saveStats();


      showResult(

        false,

        "Ты дурак",

        "Все соперники избавились от карт раньше."

      );

    }

    else{

      stats.wins++;


      saveStats();


      showResult(

        true,

        "Победа",

        "Ты не остался последним."

      );

    }


    return true;

  }


  return false;

}


function showResult(
  win,
  title,
  text
){

  $("resultIcon")
    .textContent=

      win
        ?"🏆"
        :"🃏";


  $("resultTitle")
    .textContent=
      title;


  $("resultText")
    .textContent=
      text;


  $("resultOverlay")
    .classList
    .remove(
      "hidden"
    );

}


/* =========================================
   AI ATTACK
========================================= */

async function aiAttack(
  playerIndex
){

  if(
    gameOver
  ){

    return;

  }


  setActionCue(

    playerIndex,

    " думает..."

  );


  let thinkTime=

    AI_SPEED[
      difficulty
    ].think;


  if(
    players[playerIndex]
      .style==="careful"
  ){

    thinkTime+=150;

  }


  if(
    players[playerIndex]
      .style==="aggressive"
  ){

    thinkTime-=120;

  }


  await sleep(
    thinkTime
  );


  if(
    phase!=="attack"
    ||
    currentThrower!==playerIndex
    ||
    gameOver
  ){

    clearActionCue();

    return;

  }


  const options=

    players[playerIndex]
      .hand
      .filter(
        canThrow
      );


  let passChance=
    0;


  if(
    table.length
  ){

    if(
      players[playerIndex]
        .style==="careful"
    ){

      passChance=
        .28;

    }


    if(
      players[playerIndex]
        .style==="normal"
    ){

      passChance=
        .12;

    }


    if(
      players[playerIndex]
        .style==="aggressive"
    ){

      passChance=
        .03;

    }

  }


  if(
    difficulty==="easy"
  ){

    passChance+=
      .15;

  }


  if(
    !options.length
    ||
    Math.random()<
      passChance
  ){

    setActionCue(

      playerIndex,

      " пасует"

    );


    await sleep(
      650
    );


    passed.add(
      playerIndex
    );


    clearActionCue();


    moveToNextThrower();


    return;

  }


  const card=

    chooseAIAttack(
      playerIndex,
      options
    );


  await playAttackCard(
    playerIndex,
    card
  );

}


/* =========================================
   AI DEFENSE
========================================= */

async function aiDefend(
  playerIndex
){

  if(
    gameOver
  ){

    return;

  }


  setActionCue(

    playerIndex,

    " думает..."

  );


  await sleep(

    AI_SPEED[
      difficulty
    ].think

  );


  const pair=
    unresolvedPair();


  if(
    !pair
    ||
    defender!==playerIndex
    ||
    phase!=="defense"
    ||
    gameOver
  ){

    clearActionCue();

    return;

  }


  if(
    gameMode==="transfer"
  ){

    const transfers=

      players[playerIndex]
        .hand
        .filter(
          card=>
            canTransfer(
              playerIndex,
              card
            )
        );


    if(
      transfers.length
    ){

      const transferCard=

        cheapest(
          transfers,
          true
        );


      if(
        aiWantsTransfer(
          playerIndex,
          transferCard
        )
      ){

        await transferAttack(
          playerIndex,
          transferCard
        );


        return;

      }

    }

  }


  const defense=

    chooseAIDefense(
      playerIndex,
      pair.attack
    );


  if(
    !defense
  ){

    await defenderTakes();

    return;

  }


  const bot=
    players[playerIndex];


  if(
    difficulty==="hard"
    &&
    bot.style==="careful"
    &&
    defense.suit===trump
    &&
    pair.attack.suit!==trump
    &&
    value(defense)>=6
    &&
    bot.hand.length>4
    &&
    Math.random()<.34
  ){

    await defenderTakes();

    return;

  }


  await defendWith(
    playerIndex,
    defense
  );

}


/* =========================================
   SCHEDULER
========================================= */

function scheduleCurrentAction(){

  if(
    gameOver
    ||
    locked
  ){

    return;

  }


  render();


  if(
    phase==="defense"
  ){

    if(
      defender===0
    ){

      clearActionCue();

      return;

    }


    aiDefend(
      defender
    );


    return;

  }


  if(
    currentThrower===0
  ){

    clearActionCue();

    return;

  }


  aiAttack(
    currentThrower
  );

}

  await sleep(

  );

function setupChoice(
  selector,
  callback
){

  document
    .querySelectorAll(
      selector
    )
    .forEach(
      button=>{

        button.onclick=
          ()=>{

            document
              .querySelectorAll(
                selector
              )
              .forEach(
                item=>
                  item
                    .classList
                    .remove(
                      "active"
                    )
              );


            button
              .classList
              .add(
                "active"
              );


            callback(
              button
            );

          };

      }
    );

}


setupChoice(

  "[data-mode]",

  button=>{

    gameMode=
      button.dataset.mode;

  }

);


setupChoice(

  "[data-opponents]",

  button=>{

    opponentCount=

      Number(
        button.dataset.opponents
      );

  }

);


setupChoice(

  "[data-difficulty]",

  button=>{

    difficulty=
      button.dataset.difficulty;

  }

);


$("startButton")
  .onclick=
    startGame;


$("againButton")
  .onclick=
    ()=>{

      $("resultOverlay")
        .classList
        .add(
          "hidden"
        );


      $("startOverlay")
        .classList
        .remove(
          "hidden"
        );

    };


window.addEventListener(
  "resize",
  ()=>{

    if(
      players.length
    ){

      render();

    }

  }
);


renderStats();
