<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дурак</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  background:#06150f;
  color:#fff;
}

button,select{
  font:inherit;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:650px;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 45%,
      #1b6847 0,
      #104a34 38%,
      #0a3022 70%,
      #061911 100%
    );
}

.game:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.14;
  background-image:
    repeating-linear-gradient(
      35deg,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 4px
    ),
    repeating-linear-gradient(
      -35deg,
      rgba(0,0,0,.04) 0 1px,
      transparent 1px 5px
    );
}

.game:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 50% 48%,
      transparent 45%,
      rgba(0,0,0,.2) 100%
    );
}


/* HEADER */

.header{
  position:absolute;
  top:18px;
  left:24px;
  right:24px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  z-index:50;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:2px;

  text-shadow:
    0 3px 12px rgba(0,0,0,.4);
}

.logo small{
  display:block;

  margin-top:3px;

  font-size:9px;
  letter-spacing:4px;

  color:#e6ca7d;
}

.status-wrap{
  display:flex;
  gap:10px;
  align-items:center;
}

.status,
.memory-pill{
  padding:10px 16px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:rgba(6,26,18,.72);

  backdrop-filter:blur(8px);

  box-shadow:
    0 8px 25px rgba(0,0,0,.18);

  font-size:13px;

  color:#eef4f0;
}

.memory-pill{
  padding:9px 13px;

  color:#cbd8d1;

  font-size:11px;
}


/* CARD */

.card{
  width:84px;
  height:118px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  border-radius:11px;

  border:1px solid #cfc7ba;

  background:
    linear-gradient(
      145deg,
      #fffefa,
      #eee8de
    );

  color:#171717;

  font-size:32px;
  font-weight:700;

  box-shadow:
    0 10px 23px rgba(0,0,0,.44);

  user-select:none;

  transform-origin:center center;
}

.card.red{
  color:#c92735;
}

.corner{
  position:absolute;

  left:8px;
  top:7px;

  font-size:17px;
  line-height:16px;

  text-align:center;
}

.corner span{
  display:block;

  font-size:16px;
}

.corner.bottom{
  left:auto;
  top:auto;

  right:8px;
  bottom:7px;

  transform:rotate(180deg);
}

.card.back{
  border:5px solid #eee8dc;

  background:
    repeating-linear-gradient(
      45deg,
      #173b67 0 5px,
      #eee6d8 5px 8px,
      #942b36 8px 13px,
      #eee6d8 13px 16px
    );
}


/* HAND */

.hand{
  position:absolute;

  left:50%;

  transform:translateX(-50%);

  height:160px;

  z-index:30;
}

.cpu-hand{
  top:64px;
}

.player-hand{
  bottom:-4px;
}

.hand .card{
  position:absolute;

  left:50%;
  top:0;

  will-change:transform;

  transition:
    transform .48s cubic-bezier(.22,.78,.22,1),
    opacity .22s ease,
    filter .22s ease,
    box-shadow .2s ease;
}

.player-hand .card{
  top:22px;
}

.player-hand .card.playable{
  cursor:pointer;
}

.player-hand .card.playable:hover{
  z-index:100!important;

  box-shadow:
    0 18px 34px rgba(0,0,0,.52);
}

.player-hand .card.disabled{
  opacity:.7;

  filter:
    brightness(.88)
    saturate(.92);
}


/* TABLE */

.table{
  position:absolute;

  left:50%;
  top:46%;

  transform:translate(-50%,-50%);

  width:min(760px,66vw);
  min-height:318px;

  display:grid;

  grid-template-columns:
    repeat(3,120px);

  grid-auto-rows:154px;

  justify-content:center;
  align-content:center;

  gap:10px 26px;

  z-index:15;
}

.pair{
  width:120px;
  height:154px;

  position:relative;

  transform:
    translate(
      var(--px,0px),
      var(--py,0px)
    )
    rotate(
      var(--pr,0deg)
    );

  transition:
    transform .3s ease;
}

.pair .card{
  position:absolute;

  left:0;
  top:5px;
}

.pair .card.defense{
  left:30px;
  top:28px;

  transform:rotate(8deg);
}


/* DECK */

.deck-zone{
  position:absolute;

  left:6%;
  top:46%;

  transform:translateY(-50%);

  width:180px;
  height:175px;

  z-index:12;
}

.deck-card{
  position:absolute;

  left:0;
  top:18px;

  z-index:4;
}

.deck-trump{
  position:absolute;

  left:40px;
  top:18px;

  z-index:1;

  transform:rotate(90deg);
}

.deck-card .card,
.deck-trump .card{
  margin:0;
}

.deck-count{
  position:absolute;

  left:4px;
  top:145px;

  font-size:11px;

  color:#c4d0ca;
}

.trump-symbol{
  position:absolute;

  left:112px;
  top:50px;

  font-size:34px;
}


/* DISCARD */

.discard{
  position:absolute;

  right:7%;
  bottom:25%;

  width:105px;
  height:135px;

  z-index:10;

  opacity:.88;
}

.discard-card{
  position:absolute;

  width:70px;
  height:98px;

  left:17px;
  top:10px;

  border:4px solid #eae4d8;
  border-radius:9px;

  background:
    repeating-linear-gradient(
      45deg,
      #173b67 0 5px,
      #eee6d8 5px 8px,
      #942b36 8px 13px,
      #eee6d8 13px 16px
    );

  box-shadow:
    0 8px 18px rgba(0,0,0,.32);
}

.discard-card:nth-child(1){
  transform:rotate(-7deg);
}

.discard-card:nth-child(2){
  transform:rotate(5deg);
}

.discard-card:nth-child(3){
  transform:rotate(-1deg);
}

.discard-label{
  position:absolute;

  left:0;
  right:0;
  bottom:-3px;

  text-align:center;

  font-size:9px;
  letter-spacing:2px;

  text-transform:uppercase;

  color:#aab8b1;
}


/* ACTION */

.action{
  position:absolute;

  right:6%;
  top:46%;

  transform:translateY(-50%);

  z-index:40;
}

.action button{
  min-width:112px;

  padding:12px 20px;

  border:1px solid rgba(255,255,255,.14);
  border-radius:10px;

  background:#eee9df;

  color:#18241e;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 7px 18px rgba(0,0,0,.25);

  transition:
    transform .14s ease,
    filter .14s ease;
}

.action button:hover{
  transform:translateY(-2px);

  filter:brightness(1.05);
}

.action button.danger{
  background:#96323d;

  color:#fff;
}

.hidden{
  display:none!important;
}


/* FLY */

.flying-card{
  position:fixed!important;

  z-index:1000!important;

  margin:0!important;

  pointer-events:none!important;

  will-change:
    transform,
    opacity;
}


/* MENU */

.start-screen,
.result-overlay{
  position:fixed;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:200;

  background:
    radial-gradient(
      circle at 50% 40%,
      #15452f,
      #061a12
    );
}

.start-box{
  width:430px;

  padding:34px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:rgba(10,35,24,.96);

  box-shadow:
    0 30px 80px rgba(0,0,0,.5);
}

.start-box h1{
  margin:0;

  font-size:46px;
  letter-spacing:3px;
}

.start-box p{
  margin:8px 0 24px;

  color:#aab9b1;

  line-height:1.45;
}

.menu-row{
  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:8px;

  margin-bottom:18px;
}

.diff-btn{
  padding:11px 8px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;

  background:#133627;

  color:#dce7e1;

  cursor:pointer;

  font-weight:800;
}

.diff-btn.active{
  background:#e8c975;

  color:#1b231e;

  border-color:#e8c975;
}

.stats-box{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;

  margin:18px 0;
}

.stat{
  padding:10px 6px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;

  background:
    rgba(255,255,255,.035);

  text-align:center;
}

.stat b{
  display:block;

  font-size:18px;
}

.stat span{
  display:block;

  margin-top:2px;

  font-size:9px;

  color:#9fb0a7;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.start-actions{
  display:flex;

  gap:8px;
}

.start-box button.main,
.result-box button{
  flex:1;

  padding:14px;

  border:0;
  border-radius:11px;

  background:#e8c975;

  color:#1b231e;

  font-weight:900;

  cursor:pointer;
}

.reset-btn{
  padding:14px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;

  background:transparent;

  color:#b7c5bd;

  cursor:pointer;
}


/* RESULT */

.result-overlay{
  z-index:300;

  background:rgba(2,12,8,.74);

  backdrop-filter:blur(7px);
}

.result-box{
  width:410px;

  padding:34px;

  text-align:center;

  border-radius:25px;

  color:#17201b;

  background:
    linear-gradient(
      145deg,
      #fffdf6,
      #e9e2d4
    );

  box-shadow:
    0 30px 90px rgba(0,0,0,.54);
}

.result-icon{
  font-size:46px;
}

.result-title{
  margin:8px 0 0;

  font-size:31px;
}

.result-text{
  margin:8px 0 16px;

  color:#655f56;
}

.result-stats{
  margin:0 0 18px;

  color:#736d63;

  font-size:13px;
}

.result-box button{
  width:100%;
}


/* MOBILE */

@media(max-width:850px){

  .card{
    width:66px;
    height:94px;

    font-size:25px;
  }

  .corner{
    font-size:14px;
    line-height:13px;
  }

  .corner span{
    font-size:13px;
  }

  .hand{
    height:130px;
  }

  .player-hand{
    bottom:-2px;
  }

  .player-hand .card{
    top:18px;
  }

  .table{
    width:56vw;

    grid-template-columns:
      repeat(2,92px);

    grid-auto-rows:120px;

    gap:8px 18px;
  }

  .pair{
    width:92px;
    height:120px;
  }

  .pair .card.defense{
    left:23px;
    top:22px;
  }

  .deck-zone{
    left:2%;

    transform:
      translateY(-50%)
      scale(.82);

    transform-origin:left center;
  }

  .discard{
    right:2%;

    transform:scale(.8);

    transform-origin:right bottom;
  }

  .action{
    right:2%;
  }

  .memory-pill{
    display:none;
  }

  .start-box{
    width:min(94vw,430px);
  }
}

</style>
</head>

<body>

<div class="game">

  <div class="header">

    <div class="logo">
      ДУРАК
      <small>ПОДКИДНОЙ</small>
    </div>

    <div class="status-wrap">

      <div
        class="memory-pill"
        id="memoryPill"
      >
        Вышло: 0 · Козыри: 0
      </div>

      <div
        class="status"
        id="status"
      >
        Начинаем...
      </div>

    </div>

  </div>


  <div
    class="hand cpu-hand"
    id="cpuHand"
  ></div>


  <div class="deck-zone">

    <div
      class="deck-trump"
      id="deckTrump"
    ></div>

    <div
      class="deck-card"
      id="deckCard"
    ></div>

    <div
      class="deck-count"
      id="deckCount"
    ></div>

    <div
      class="trump-symbol"
      id="trumpSymbol"
    ></div>

  </div>


  <div
    class="table"
    id="table"
  ></div>


  <div
    class="discard"
    id="discard"
  >

    <div class="discard-label">
      Бито
    </div>

  </div>


  <div class="action">

    <button
      id="actionButton"
      class="hidden"
    ></button>

  </div>


  <div
    class="hand player-hand"
    id="playerHand"
  ></div>

</div>


<div
  class="start-screen"
  id="startScreen"
>

  <div class="start-box">

    <h1>ДУРАК</h1>

    <p>
      Классический подкидной Дурак.
      36 карт.
    </p>


    <div class="menu-row">

      <button
        class="diff-btn"
        data-difficulty="easy"
      >
        Легко
      </button>

      <button
        class="diff-btn active"
        data-difficulty="medium"
      >
        Средне
      </button>

      <button
        class="diff-btn"
        data-difficulty="hard"
      >
        Сложно
      </button>

    </div>


    <div class="stats-box">

      <div class="stat">
        <b id="statWins">0</b>
        <span>Победы</span>
      </div>

      <div class="stat">
        <b id="statLosses">0</b>
        <span>Поражения</span>
      </div>

      <div class="stat">
        <b id="statRate">0%</b>
        <span>Винрейт</span>
      </div>

      <div class="stat">
        <b id="statBest">0</b>
        <span>Лучшая серия</span>
      </div>

    </div>


    <div class="start-actions">

      <button
        class="main"
        id="startButton"
      >
        Начать игру
      </button>

      <button
        class="reset-btn"
        id="resetStatsButton"
      >
        Сброс
      </button>

    </div>

  </div>

</div>


<div
  class="result-overlay hidden"
  id="resultOverlay"
>

  <div class="result-box">

    <div
      class="result-icon"
      id="resultIcon"
    ></div>

    <h2
      class="result-title"
      id="resultTitle"
    ></h2>

    <div
      class="result-text"
      id="resultText"
    ></div>

    <div
      class="result-stats"
      id="resultStats"
    ></div>

    <button id="againButton">
      Играть ещё
    </button>

  </div>

</div>


<script>

const suits=[
  "♠",
  "♥",
  "♦",
  "♣"
];

const suitOrder=[
  "♣",
  "♦",
  "♥",
  "♠"
];

const ranks=[
  "6",
  "7",
  "8",
  "9",
  "10",
  "J",
  "Q",
  "K",
  "A"
];


const $=
  id=>
    document.getElementById(id);


const sleep=
  ms=>
    new Promise(
      resolve=>
        setTimeout(
          resolve,
          ms
        )
    );


let deck=[];

let player=[];

let cpu=[];

let table=[];


let discardCount=0;

let trump=null;

let bottomTrump=null;


let attacker="player";

let defender="cpu";


let defenderTaking=false;

let defenderStartCards=6;


let gameOver=false;

let locked=false;

let audioCtx=null;


let difficulty=
  localStorage.getItem(
    "durakDifficulty"
  )
  ||
  "medium";


let seenCards=
  new Set();


let seenTrumpCards=
  new Set();


let resultSaved=false;


const defaultStats={

  wins:0,

  losses:0,

  draws:0,

  currentStreak:0,

  bestStreak:0,

  games:0

};


let stats=
  loadStats();



/* STATS */

function loadStats(){

  try{

    return {

      ...defaultStats,

      ...JSON.parse(
        localStorage.getItem(
          "durakStats"
        )
        ||
        "{}"
      )

    };

  }

  catch(error){

    return {
      ...defaultStats
    };

  }

}


function saveStats(){

  localStorage.setItem(

    "durakStats",

    JSON.stringify(
      stats
    )

  );


  renderStats();

}


function renderStats(){

  $("statWins")
    .textContent=
      stats.wins;


  $("statLosses")
    .textContent=
      stats.losses;


  const decisive=

    stats.wins
    +
    stats.losses;


  $("statRate")
    .textContent=

      (
        decisive

          ?

            Math.round(
              stats.wins
              /
              decisive
              *
              100
            )

          :

            0
      )

      +

      "%";


  $("statBest")
    .textContent=
      stats.bestStreak;

}


function resetStats(){

  stats={
    ...defaultStats
  };


  saveStats();

}



/* DIFFICULTY */

function setDifficulty(
  value
){

  difficulty=
    value;


  localStorage.setItem(

    "durakDifficulty",

    value

  );


  document
    .querySelectorAll(
      ".diff-btn"
    )
    .forEach(
      button=>{

        button
          .classList
          .toggle(

            "active",

            button
              .dataset
              .difficulty
            ===
            value

          );

      }
    );

}



/* BASIC */

function isRed(suit){

  return (
    suit==="♥"
    ||
    suit==="♦"
  );

}


function value(card){

  return ranks.indexOf(
    card.rank
  );

}


function createDeck(){

  const result=[];

  let id=0;


  for(
    const suit
    of suits
  ){

    for(
      const rank
      of ranks
    ){

      result.push({

        suit,

        rank,

        id:
          "c"+id++

      });

    }

  }


  return result;

}


function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j=

      Math.floor(
        Math.random()
        *
        (
          i+1
        )
      );


    [
      array[i],
      array[j]
    ]

    =

    [
      array[j],
      array[i]
    ];

  }


  return array;

}


function removeCard(
  hand,
  id
){

  const index=

    hand.findIndex(
      card=>
        card.id===id
    );


  if(
    index<0
  ){

    return null;

  }


  return hand.splice(
    index,
    1
  )[0];

}



/* MEMORY */

function markSeen(card){

  if(!card){

    return;

  }


  seenCards.add(
    card.id
  );


  if(
    card.suit===trump
  ){

    seenTrumpCards.add(
      card.id
    );

  }

}


function markTableSeen(){

  for(
    const pair
    of table
  ){

    markSeen(
      pair.attack
    );


    if(
      pair.defense
    ){

      markSeen(
        pair.defense
      );

    }

  }

}


function remainingTrumpEstimate(){

  return Math.max(

    0,

    9

    -

    seenTrumpCards.size

    -

    cpu.filter(
      card=>
        card.suit===trump
    ).length

  );

}



/* SOUND */

function sound(kind){

  try{

    if(!audioCtx){

      audioCtx=

        new (
          window.AudioContext
          ||
          window.webkitAudioContext
        )();

    }


    const oscillator=
      audioCtx.createOscillator();


    const gain=
      audioCtx.createGain();


    oscillator.type=
      "triangle";


    oscillator.frequency.value=

      kind==="take"

        ?

          160

        :

        kind==="beat"

          ?

            500

          :

            320;


    gain.gain.setValueAtTime(

      .014,

      audioCtx.currentTime

    );


    gain.gain.exponentialRampToValueAtTime(

      .0001,

      audioCtx.currentTime
      +
      .07

    );


    oscillator
      .connect(gain)
      .connect(
        audioCtx.destination
      );


    oscillator.start();


    oscillator.stop(

      audioCtx.currentTime
      +
      .075

    );

  }

  catch(error){}

}



/* CARD HTML */

function cardHTML(
  card,
  back=false,
  extra=""
){

  if(back){

    return `

      <div
        class="
          card
          back
          ${extra}
        "

        data-id="${card?.id||""}"
      ></div>

    `;

  }


  return `

    <div
      class="
        card
        ${isRed(card.suit)?"red":""}
        ${extra}
      "

      data-id="${card.id}"
    >

      <div class="corner">

        ${card.rank}

        <span>
          ${card.suit}
        </span>

      </div>

      ${card.suit}

      <div class="corner bottom">

        ${card.rank}

        <span>
          ${card.suit}
        </span>

      </div>

    </div>

  `;

}



/* SORT */

function sortedPlayerHand(){

  return [
    ...player
  ].sort(
    (
      a,
      b
    )=>{

      const aTrump=
        a.suit===trump;


      const bTrump=
        b.suit===trump;


      if(
        aTrump!==bTrump
      ){

        return (
          aTrump
            ?1
            :-1
        );

      }


      if(
        value(a)!==
        value(b)
      ){

        return (
          value(a)
          -
          value(b)
        );

      }


      return (

        suitOrder.indexOf(
          a.suit
        )

        -

        suitOrder.indexOf(
          b.suit
        )

      );

    }
  );

}



/* RULES */

function beats(
  defenseCard,
  attackCard
){

  return (

    (
      defenseCard.suit===
        attackCard.suit

      &&

      value(defenseCard)>
        value(attackCard)
    )

    ||

    (
      defenseCard.suit===
        trump

      &&

      attackCard.suit!==
        trump
    )

  );

}


function tableRanks(){

  const result=[];


  for(
    const pair
    of table
  ){

    result.push(
      pair.attack.rank
    );


    if(
      pair.defense
    ){

      result.push(
        pair.defense.rank
      );

    }

  }


  return result;

}


function maxAttacks(){

  return Math.min(

    6,

    defenderStartCards

  );

}


function unresolved(){

  return table.some(
    pair=>
      !pair.defense
  );

}


function canAttack(card){

  return (

    table.length<
      maxAttacks()

    &&

    (
      !table.length

      ||

      tableRanks()
        .includes(
          card.rank
        )
    )

  );

}


function canPlayerPlay(card){

  if(
    gameOver
    ||
    locked
  ){

    return false;

  }


  if(
    attacker==="player"
  ){

    if(
      !defenderTaking
      &&
      unresolved()
    ){

      return false;

    }


    return canAttack(
      card
    );

  }


  if(
    defender==="player"
    &&
    !defenderTaking
  ){

    const pair=

      table.find(
        pair=>
          !pair.defense
      );


    return (

      !!pair

      &&

      beats(
        card,
        pair.attack
      )

    );

  }


  return false;

}



/* HAND */

function handLayout(
  cards,
  isCpu=false
){

  const total=
    cards.length;


  const cardWidth=

    window.innerWidth<=850

      ?

        66

      :

        84;


  const maxWidth=

    Math.min(

      window.innerWidth
      *
      (
        isCpu
          ?.50
          :.86
      ),

      isCpu
        ?500
        :980

    );


  const step=

    total<=1

      ?

        0

      :

        Math.max(

          18,

          Math.min(

            58,

            (
              maxWidth
              -
              cardWidth
            )

            /

            (
              total-1
            )

          )

        );


  const totalWidth=

    cardWidth

    +

    (
      total-1
    )

    *
    step;


  return cards.map(
    (
      card,
      index
    )=>{

      const relative=

        index
        -
        (
          total-1
        )
        /
        2;


      const strength=

        total>14

          ?.8

          :

        total>10

          ?1.2

          :

        total>7

          ?1.7

          :

            2.25;


      const rotation=

        Math.max(

          -12,

          Math.min(

            12,

            relative
            *
            strength

          )

        )

        *

        (
          isCpu
            ?-1
            :1
        );


      const drop=

        Math.abs(
          relative
        )

        *

        (
          total>14

            ?.55

            :

          total>10

            ?.8

            :

          total>7

            ?1.1

            :

              1.6
        );


      return {

        card,

        x:

          -
          totalWidth
          /
          2

          +

          index
          *
          step,

        rotation,

        drop,

        z:
          index+1

      };

    }
  );

}



/* FLIP */

function capturePositions(
  container
){

  const map=
    new Map();


  container
    .querySelectorAll(
      ".card[data-id]"
    )
    .forEach(
      element=>{

        const rect=

          element
            .getBoundingClientRect();


        map.set(

          element.dataset.id,

          {

            left:
              rect.left,

            top:
              rect.top

          }

        );

      }
    );


  return map;

}


function animateFlip(
  container,
  before
){

  container
    .querySelectorAll(
      ".card[data-id]"
    )
    .forEach(
      element=>{

        const old=

          before.get(
            element.dataset.id
          );


        if(!old){

          return;

        }


        const now=

          element
            .getBoundingClientRect();


        const dx=

          old.left
          -
          now.left;


        const dy=

          old.top
          -
          now.top;


        if(
          Math.abs(dx)<1
          &&
          Math.abs(dy)<1
        ){

          return;

        }


        element.animate(

          [

            {

              transform:

                `translate(
                  ${dx}px,
                  ${dy}px
                )
                ${element.style.transform||""}`

            },

            {

              transform:
                element.style.transform
                ||
                "none"

            }

          ],

          {

            duration:430,

            easing:
              "cubic-bezier(.22,.78,.22,1)"

          }

        );

      }
    );

}


function syncHand(
  container,
  cards,
  isCpu=false
){

  const before=

    capturePositions(
      container
    );


  const existing=

    new Map(

      [
        ...
        container.querySelectorAll(
          ".card"
        )
      ]
      .map(
        element=>
          [
            element.dataset.id,
            element
          ]
      )

    );


  const keep=

    new Set(

      cards.map(
        card=>
          card.id
      )

    );


  for(
    const [
      id,
      element
    ]
    of existing
  ){

    if(
      !keep.has(id)
    ){

      element.remove();

    }

  }


  const layout=

    handLayout(
      cards,
      isCpu
    );


  const firstTrump=

    isCpu

      ?

        -1

      :

        cards.findIndex(
          card=>
            card.suit===trump
        );


  layout.forEach(
    (
      item,
      index
    )=>{

      let element=

        existing.get(
          item.card.id
        );


      if(!element){

        const wrapper=

          document.createElement(
            "div"
          );


        wrapper.innerHTML=

          cardHTML(
            item.card,
            isCpu
          );


        element=
          wrapper.firstElementChild;


        element.style.opacity=
          "0";


        container.appendChild(
          element
        );


        requestAnimationFrame(
          ()=>{

            element.style.opacity=
              "1";

          }
        );

      }


      if(!isCpu){

        const playable=

          canPlayerPlay(
            item.card
          );


        element
          .classList
          .toggle(
            "playable",
            playable
          );


        element
          .classList
          .toggle(
            "disabled",
            !playable
          );

      }


      let x=
        item.x;


      if(
        !isCpu
        &&
        index===firstTrump
        &&
        firstTrump>0
      ){

        x+=18;

      }


      element.style.zIndex=
        item.z;


      element.style.transform=

        `translateX(${x}px)
         translateY(${item.drop}px)
         rotate(${item.rotation}deg)`;

    }
  );


  requestAnimationFrame(
    ()=>{

      animateFlip(
        container,
        before
      );

    }
  );

}



/* TABLE */

function pairJitter(index){

  const xs=[
    -5,4,-2,5,-4,3
  ];


  const ys=[
    2,-3,4,-2,1,-4
  ];


  const rotations=[
    -2.5,1.8,-1.3,2.3,-1.8,1.2
  ];


  return {

    x:
      xs[index%6],

    y:
      ys[index%6],

    r:
      rotations[index%6]

  };

}

/* ANIMATION */

function makeGhost(
  element
){

  const rect=

    element
      .getBoundingClientRect();


  const clone=

    element.cloneNode(
      true
    );


  clone.classList.add(
    "flying-card"
  );


  Object.assign(

    clone.style,

    {

      left:
        rect.left+"px",

      top:
        rect.top+"px",

      width:
        rect.width+"px",

      height:
        rect.height+"px",

      transform:
        "none"

    }

  );


  document.body
    .appendChild(
      clone
    );


  return {

    clone,

    rect

  };

}


async function arcFlight(
  element,
  target,
  {
    duration=520,
    lift=70,
    rotate=5,
    scale=.98,
    fade=false
  }={}
){

  if(
    !element
    ||
    !target
  ){

    return;

  }


  const {

    clone,

    rect:from

  }=
    makeGhost(
      element
    );


  const to=

    target
      .getBoundingClientRect();


  const dx=

    to.left

    +

    to.width/2

    -

    from.width/2

    -

    from.left;


  const dy=

    to.top

    +

    to.height/2

    -

    from.height/2

    -

    from.top;


  const animation=

    clone.animate(

      [

        {

          transform:
            "translate(0,0) rotate(0) scale(1)",

          opacity:1

        },

        {

          transform:

            `translate(
              ${dx*.52}px,
              ${dy*.45-lift}px
            )
            rotate(${rotate*.45}deg)
            scale(1.02)`,

          opacity:1,

          offset:.5

        },

        {

          transform:

            `translate(
              ${dx}px,
              ${dy}px
            )
            rotate(${rotate}deg)
            scale(${scale})`,

          opacity:

            fade
              ?.15
              :1

        }

      ],

      {

        duration,

        easing:
          "cubic-bezier(.22,.78,.22,1)",

        fill:
          "forwards"

      }

    );


  try{

    await animation.finished;

  }

  catch(error){}


  clone.remove();

}


async function cascadeTableTo(
  target,
  mode="take"
){

  const cards=

    [
      ...
      document.querySelectorAll(
        "#table .card"
      )
    ];


  await Promise.all(

    cards.map(
      (
        card,
        index
      )=>

        new Promise(
          resolve=>{

            setTimeout(
              async()=>{

                await arcFlight(

                  card,

                  target,

                  {

                    duration:500,

                    lift:

                      mode==="discard"

                        ?45

                        :65,

                    rotate:

                      (
                        index%2
                          ?1
                          :-1
                      )

                      *

                      (
                        mode==="discard"
                          ?10
                          :6
                      ),

                    scale:

                      mode==="discard"

                        ?.72

                        :.82,

                    fade:

                      mode==="discard"

                  }

                );


                resolve();

              },

              index*70

            );

          }
        )

    )

  );

}



/* DRAW */

function drawToSix(
  hand
){

  const before=
    hand.length;


  while(
    hand.length<6
    &&
    deck.length
  ){

    hand.push(
      deck.shift()
    );

  }


  return (
    hand.length
    -
    before
  );

}


async function animateDraw(
  targetId,
  count
){

  if(!count){

    return;

  }


  const target=
    $(targetId);


  for(
    let i=0;
    i<count;
    i++
  ){

    const source=

      $("deckCard")
        .querySelector(
          ".card"
        )

      ||

      $("deckTrump")
        .querySelector(
          ".card"
        );


    if(source){

      arcFlight(

        source,

        target,

        {

          duration:480,

          lift:55,

          rotate:
            (
              i%2
                ?1
                :-1
            )
            *
            4,

          scale:.82

        }

      );

    }


    sound(
      "play"
    );


    await sleep(
      95
    );

  }


  await sleep(
    220
  );

}


async function refillInOrder(
  firstSide,
  secondSide
){

    firstSide==="player"

      ?

  );

}

    .sort(

        a,
        b
      )=>
        value(a)
        -
        value(b)
    )[0];

}


async function initialDeal(){

  player=[];

  cpu=[];

  table=[];

  discardCount=0;


  render();


  locked=true;


  for(
    let i=0;
    i<6;
    i++
  ){

    for(
      const side
      of
      [
        "player",

      ]

                  ?1
                  :-1

      );

}

/* AI */

function rankMultiplicity(
  hand,
  rank
){

  return hand.filter(
    card=>
      card.rank===rank
  ).length;

}


function easyChooseAttack(
  options
){

  return [
    ...options
  ]
  .sort(
    (
      a,
      b
    )=>
      value(a)
      -
      value(b)
  )[0];

}


function mediumAttackScore(
  card
){

  const trumpPenalty=

    card.suit===trump

      ?

        22

      :

        0;


  const pairBonus=

    (
      rankMultiplicity(
        cpu,
        card.rank
      )
      -
      1
    )

    *
    -4;


  return (

    value(card)
    *
    2

    +

    trumpPenalty

    +

    pairBonus

    +

    (
      player.length<=3

        ?

          -2

        :

          0
    )

  );

}


function hardAttackScore(
  card
){

  let score=

    mediumAttackScore(
      card
    );


  if(
    card.suit===trump
    &&
    remainingTrumpEstimate()<=2
  ){

    score+=8;

  }


  if(
    deck.length===0
    &&
    player.length<=2
  ){

    score-=4;

  }


  if(
    seenCards.size>=20
  ){

    score+=1;

  }


  return score;

}


function chooseAttack(
  options
){

  if(
    difficulty==="easy"
  ){

    return easyChooseAttack(
      options
    );

  }


  const scorer=

    difficulty==="hard"

      ?

        hardAttackScore

      :

        mediumAttackScore;


  return [
    ...options
  ]
  .sort(
    (
      a,
      b
    )=>

      scorer(a)
      -
      scorer(b)

  )[0];

}


function mediumDefenseScore(
  card,
  attackCard
){

  let score=

    value(card)
    *
    2;


  if(
    card.suit===trump
    &&
    attackCard.suit!==trump
  ){

    score+=18;

  }


  if(
    rankMultiplicity(
      cpu,
      card.rank
    )
    >
    1
  ){

    score+=2;

  }


  return score;

}


function hardDefenseScore(
  card,
  attackCard
){

  let score=

    mediumDefenseScore(
      card,
      attackCard
    );


  if(
    card.suit===trump
    &&
    attackCard.suit!==trump
  ){

    if(
      remainingTrumpEstimate()<=2
    ){

      score+=10;

    }


    if(
      seenTrumpCards.size>=6
    ){

      score+=6;

    }

  }


  if(
    deck.length===0
    &&
    cpu.length<=3
  ){

    score-=6;

  }


  return score;

}


function chooseDefense(
  options,
  attackCard
){

  if(
    difficulty==="easy"
  ){

    return [
      ...options
    ]
    .sort(
      (
        a,
        b
      )=>
        value(a)
        -
        value(b)
    )[0];

  }


  const scorer=

    difficulty==="hard"

      ?

        hardDefenseScore

      :

        mediumDefenseScore;


  return [
    ...options
  ]
  .sort(
    (
      a,
      b
    )=>

      scorer(
        a,
        attackCard
      )

      -

      scorer(
        b,
        attackCard
      )

  )[0];

}


function cpuShouldTake(
  attackCard
){

  const options=

    cpu.filter(
      card=>
        beats(
          card,
          attackCard
        )
    );


  if(
    !options.length
  ){

    return true;

  }


  if(
    difficulty==="easy"
  ){

    return false;

  }


  if(
    deck.length===0
    &&
    cpu.length<=3
  ){

    return false;

  }


  const defense=

    chooseDefense(
      options,
      attackCard
    );


  const expensiveTrump=

    defense.suit===trump

    &&

    attackCard.suit!==trump

    &&

    value(defense)
    >=
    ranks.indexOf(
      "Q"
    );


  if(
    difficulty==="hard"
  ){

    const trumpPressure=

      remainingTrumpEstimate()<=3

      ||

      seenTrumpCards.size>=5;


    return (

      expensiveTrump

      &&

      trumpPressure

      &&

      value(attackCard)
      <=
      ranks.indexOf(
        "9"
      )

      &&

      table.length>=1

      &&

      cpu.length>3

    );

  }


  return (

    expensiveTrump

    &&

    value(attackCard)
    <=
    ranks.indexOf(
      "9"
    )

    &&

    table.length>=2

    &&

    cpu.length>3

  );

}


function cpuShouldContinue(){

  if(
    table.length>=
      maxAttacks()
  ){

    return false;

  }


  const options=

    cpu.filter(
      canAttack
    );


  if(
    !options.length
  ){

    return false;

  }


  if(
    difficulty==="easy"
  ){

    return (
      table.length<2
    );

  }


  if(
    player.length<=2
  ){

    return true;

  }


  const nonTrump=

    options.filter(
      card=>
        card.suit!==trump
    );


  if(
    difficulty==="hard"
  ){

    const pressure=

      seenCards.size>=18

      ||

      deck.length===0;


    if(
      nonTrump.length
    ){

      return (

        table.length
        <
        (
          pressure
            ?5
            :4
        )

      );

    }


    return (

      deck.length===0

      &&

      table.length<3

      &&

      remainingTrumpEstimate()>1

    );

  }


  if(
    nonTrump.length
  ){

    return (
      table.length<4
    );

  }


  return (

    table.length<2

    &&

    deck.length===0

  );

}



/* PLAYER */

async function playerCardClick(
  id,
  element
){

  const card=

    player.find(
      card=>
        card.id===id
    );


  if(
    !card
    ||
    !canPlayerPlay(
      card
    )
  ){

    return;

  }


  locked=true;


  renderAction();


  await arcFlight(

    element,

    $("table"),

    {

      duration:500,

      lift:65,

      rotate:4

    }

  );


  sound(
    "play"
  );


  if(
    attacker==="player"
  ){

    table.push({

      attack:

        removeCard(
          player,
          id
        ),

      defense:null

    });


    markSeen(
      table[
        table.length-1
      ].attack
    );


    render();


    if(
      !defenderTaking
    ){

      setTimeout(
        cpuDefend,
        240
      );

    }

    else{

      locked=false;


      render();

    }


    return;

  }


  const pair=

    table.find(
      pair=>
        !pair.defense
    );


  if(
    !pair
    ||
    !beats(
      card,
      pair.attack
    )
  ){

    locked=false;


    render();


    return;

  }


  pair.defense=

    removeCard(
      player,
      id
    );


  markSeen(
    pair.defense
  );


  sound(
    "beat"
  );


  render();


  setTimeout(
    cpuContinueAttack,
    260
  );

}



/* CPU DEFENSE */

async function cpuDefend(){

  if(
    defender!=="cpu"
    ||
    defenderTaking
  ){

    return;

  }


  const pair=

    table.find(
      pair=>
        !pair.defense
    );


  if(!pair){

    return;

  }


  if(
    cpuShouldTake(
      pair.attack
    )
  ){

    defenderTaking=
      true;


    locked=
      false;


    render();


    return;

  }


  const options=

    cpu.filter(
      card=>
        beats(
          card,
          pair.attack
        )
    );


  if(
    !options.length
  ){

    defenderTaking=
      true;


    locked=
      false;


    render();


    return;

  }


  const defense=

    chooseDefense(
      options,
      pair.attack
    );


  const source=

    $("cpuHand")
      .querySelector(
        `[data-id="${defense.id}"]`
      );


  await arcFlight(

    source,

    $("table"),

    {

      duration:500,

      lift:80,

      rotate:-4

    }

  );


  pair.defense=

    removeCard(
      cpu,
      defense.id
    );


  markSeen(
    pair.defense
  );


  sound(
    "beat"
  );


  locked=false;


  render();

}



/* CPU ATTACK */

async function cpuAttack(){

  if(
    attacker!=="cpu"
    ||
    gameOver
  ){

    return;

  }


  const options=

    cpu.filter(
      canAttack
    );


  if(
    !options.length
  ){

    if(
      table.length
    ){

      successfulDefense();

    }


    return;

  }


  locked=true;


  renderAction();


  const attack=

    chooseAttack(
      options
    );


  const source=

    $("cpuHand")
      .querySelector(
        `[data-id="${attack.id}"]`
      );


  await arcFlight(

    source,

    $("table"),

    {

      duration:510,

      lift:88,

      rotate:-4

    }

  );


  table.push({

    attack:

      removeCard(
        cpu,
        attack.id
      ),

    defense:null

  });


  markSeen(
    table[
      table.length-1
    ].attack
  );


  sound(
    "play"
  );


  locked=false;


  render();

}


async function cpuContinueAttack(){

  if(
    attacker!=="cpu"
    ||
    gameOver
  ){

    return;

  }


  if(
    defenderTaking
  ){

    const options=

      cpu.filter(
        canAttack
      );


    if(
      options.length
    ){

      locked=true;


      renderAction();


      const attack=

        chooseAttack(
          options
        );


      const source=

        $("cpuHand")
          .querySelector(
            `[data-id="${attack.id}"]`
          );


      await arcFlight(

        source,

        $("table"),

        {

          duration:480,

          lift:70,

          rotate:-4

        }

      );


      table.push({

        attack:

          removeCard(
            cpu,
            attack.id
          ),

        defense:null

      });


      markSeen(
        table[
          table.length-1
        ].attack
      );


      sound(
        "play"
      );


      locked=false;


      render();


      setTimeout(
        cpuContinueAttack,
        180
      );

    }

    else{

      finishTake();

    }


    return;

  }


  if(
    cpuShouldContinue()
  ){

    const attack=

      chooseAttack(

        cpu.filter(
          canAttack
        )

      );


    const source=

      $("cpuHand")
        .querySelector(
          `[data-id="${attack.id}"]`
        );


    locked=true;


    renderAction();


    await arcFlight(

      source,

      $("table"),

      {

        duration:480,

        lift:70,

        rotate:-4

      }

    );


    table.push({

      attack:

        removeCard(
          cpu,
          attack.id
        ),

      defense:null

    });


    markSeen(
      table[
        table.length-1
      ].attack
    );


    sound(
      "play"
    );


    locked=false;


    render();

  }

  else{

    successfulDefense();

  }

}



/* TAKE */

function playerTake(){

  if(
    defender!=="player"
    ||
    locked
  ){

    return;

  }


  defenderTaking=
    true;


  locked=
    true;


  sound(
    "take"
  );


  render();


  setTimeout(
    ()=>{

      locked=
        false;


      cpuContinueAttack();

    },

    260
  );

}


function collectTable(
  hand
){

  markTableSeen();


  for(
    const pair
    of table
  ){

    hand.push(
      pair.attack
    );


    if(
      pair.defense
    ){

      hand.push(
        pair.defense
      );

    }

  }


  table=[];

}


async function finishTake(){

  if(
    gameOver
    ||
    !table.length
  ){

    return;

  }


  locked=true;


  renderAction();


  const oldAttacker=
    attacker;


  const oldDefender=
    defender;


  const target=

    oldDefender==="player"

      ?

        $("playerHand")

      :

        $("cpuHand");


  await cascadeTableTo(

    target,

    "take"

  );


  collectTable(

    oldDefender==="player"

      ?

        player

      :

        cpu

  );


  defenderTaking=
    false;


  await refillInOrder(

    oldAttacker,

    oldDefender

  );


  defenderStartCards=

    (
      oldDefender==="player"

        ?

          player

        :

          cpu
    )
    .length;


  locked=false;


  checkGameEnd();


  render();


  if(
    !gameOver
    &&
    attacker==="cpu"
  ){

    setTimeout(
      cpuAttack,
      360
    );

  }

}



/* SUCCESS */

async function successfulDefense(){

  if(
    !table.length
    ||
    gameOver
    ||
    unresolved()
  ){

    return;

  }


  locked=true;


  renderAction();


  const oldAttacker=
    attacker;


  const oldDefender=
    defender;


  const discarded=

    table.reduce(
      (
        total,
        pair
      )=>

        total
        +
        1
        +
        (
          pair.defense
            ?1
            :0
        ),

      0
    );


  await cascadeTableTo(

    $("discard"),

    "discard"

  );


  markTableSeen();


  discardCount+=
    discarded;


  table=[];


  await refillInOrder(

    oldAttacker,

    oldDefender

  );


  attacker=
    oldDefender;


  defender=
    oldAttacker;


  defenderTaking=
    false;


  defenderStartCards=

    (
      defender==="player"

        ?

          player

        :

          cpu
    )
    .length;


  locked=false;


  checkGameEnd();


  render();


  if(
    !gameOver
    &&
    attacker==="cpu"
  ){

    setTimeout(
      cpuAttack,
      360
    );

  }

}



/* GAME END */

function checkGameEnd(){

  if(
    deck.length
    ||
    table.length
  ){

    return;

  }


  if(
    player.length===0
    ||
    cpu.length===0
  ){

    gameOver=
      true;


    locked=
      true;


    render();


    setTimeout(
      showResult,
      220
    );

  }

}


function recordResult(){

  if(
    resultSaved
  ){

    return;

  }


  resultSaved=
    true;


  stats.games++;


  if(
    player.length===0
    &&
    cpu.length===0
  ){

    stats.draws++;


    stats.currentStreak=
      0;

  }

  else if(
    player.length===0
  ){

    stats.wins++;


    stats.currentStreak++;


    stats.bestStreak=

      Math.max(

        stats.bestStreak,

        stats.currentStreak

      );

  }

  else{

    stats.losses++;


    stats.currentStreak=
      0;

  }


  saveStats();

}


function showResult(){

  recordResult();


  if(
    player.length===0
    &&
    cpu.length===0
  ){

    $("resultIcon")
      .textContent=
        "🤝";


    $("resultTitle")
      .textContent=
        "Ничья";


    $("resultText")
      .textContent=
        "Карты закончились одновременно.";

  }

  else if(
    player.length===0
  ){

    $("resultIcon")
      .textContent=
        "🏆";


    $("resultTitle")
      .textContent=
        "Ты выиграл";


    $("resultText")
      .textContent=
        "У тебя не осталось карт.";

  }

  else{

    $("resultIcon")
      .textContent=
        "🃏";


    $("resultTitle")
      .textContent=
        "Ты дурак";


    $("resultText")
      .textContent=
        "Компьютер избавился от карт раньше.";

  }


  $("resultStats")
    .textContent=

      `Победы ${stats.wins} · Поражения ${stats.losses} · Серия ${stats.currentStreak} · Лучшая ${stats.bestStreak}`;


  $("resultOverlay")
    .classList
    .remove(
      "hidden"
    );

}



/* EVENTS */

$("playerHand")
  .addEventListener(
    "click",
    event=>{

      const element=

        event.target.closest(
          ".card[data-id]"
        );


      if(element){

        playerCardClick(

          element.dataset.id,

          element

        );

      }

    }
  );


document
  .querySelectorAll(
    ".diff-btn"
  )
  .forEach(
    button=>{

      button.onclick=
        ()=>{

          setDifficulty(
            button.dataset.difficulty
          );

        };

    }
  );


$("resetStatsButton")
  .onclick=
    ()=>{

      if(
        confirm(
          "Сбросить всю статистику?"
        )
      ){

        resetStats();

      }

    };


$("startButton")
  .onclick=
    startGame;


$("againButton")
  .onclick=
    startGame;


window.addEventListener(
  "resize",
  render
);


setDifficulty(
  difficulty
);


renderStats();


render();

</script>
