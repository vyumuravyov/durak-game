<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дурак</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#06150f;
}

button{
  font:inherit;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:650px;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 48%,
      #1b6847 0,
      #104a34 38%,
      #0a3022 70%,
      #061911 100%
    );
}

.game::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.14;
  pointer-events:none;

  background-image:
    repeating-linear-gradient(
      35deg,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 4px
    ),
    repeating-linear-gradient(
      -35deg,
      rgba(0,0,0,.04) 0 1px,
      transparent 1px 5px
    );
}

.game::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle,
      transparent 46%,
      rgba(0,0,0,.2)
    );
}


/* HEADER */

.header{
  position:absolute;
  top:18px;
  left:24px;
  right:24px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  z-index:100;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:2px;
}

.logo small{
  display:block;
  margin-top:3px;

  font-size:9px;
  letter-spacing:4px;

  color:#e6ca7d;
}

.status-wrap{
  display:flex;
  gap:8px;
}

.pill{
  padding:10px 15px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:rgba(6,26,18,.75);
  backdrop-filter:blur(8px);

  font-size:12px;

  box-shadow:0 8px 25px rgba(0,0,0,.18);
}


/* PLAYERS */

.opponent{
  position:absolute;

  min-width:115px;

  text-align:center;

  z-index:40;
}

.opponent-name{
  display:inline-flex;
  align-items:center;
  gap:6px;

  margin-bottom:7px;
  padding:6px 10px;

  border-radius:18px;

  background:rgba(3,18,12,.62);

  font-size:11px;
}

.opponent-name.defender{
  outline:2px solid rgba(232,201,117,.8);
}

.opponent-name.attacker{
  color:#1d261f;
  background:#e8c975;
}

.opponent-count{
  opacity:.7;
  font-size:10px;
}

.bot-hand{
  position:relative;

  width:160px;
  height:80px;

  margin:auto;
}


/* LOCATIONS */

.opponent.top{
  left:50%;
  top:57px;

  transform:translateX(-50%);
}

.opponent.left{
  left:35px;
  top:34%;

  transform:translateY(-50%);
}

.opponent.right{
  right:35px;
  top:34%;

  transform:translateY(-50%);
}


/* CARD */

.card{
  width:82px;
  height:116px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  border:1px solid #cec6b9;
  border-radius:11px;

  color:#171717;

  background:
    linear-gradient(145deg,#fffefa,#eee8de);

  box-shadow:
    0 10px 23px rgba(0,0,0,.43);

  font-size:31px;
  font-weight:700;

  user-select:none;

  transform-origin:center;
}

.card.red{
  color:#c92735;
}

.corner{
  position:absolute;

  left:8px;
  top:7px;

  font-size:16px;
  line-height:15px;

  text-align:center;
}

.corner span{
  display:block;
}

.corner.bottom{
  left:auto;
  top:auto;

  right:8px;
  bottom:7px;

  transform:rotate(180deg);
}

.card.back{
  border:5px solid #eee8dc;

  background:
    repeating-linear-gradient(
      45deg,
      #173b67 0 5px,
      #eee6d8 5px 8px,
      #942b36 8px 13px,
      #eee6d8 13px 16px
    );
}


/* BOT CARDS */

.bot-hand .card{
  position:absolute;

  left:50%;
  top:0;

  width:56px;
  height:78px;

  transform:
    translateX(calc(-50% + var(--x)))
    rotate(var(--r));

  transition:.35s ease;
}


/* PLAYER HAND */

.player-area{
  position:absolute;

  left:50%;
  bottom:0;

  width:94vw;
  height:180px;

  transform:translateX(-50%);

  z-index:60;
}

.player-name{
  position:absolute;

  left:50%;
  bottom:150px;

  transform:translateX(-50%);

  padding:5px 12px;

  border-radius:15px;

  background:rgba(3,18,12,.62);

  font-size:11px;
}

.player-name.defender{
  outline:2px solid rgba(232,201,117,.8);
}

.player-name.attacker{
  color:#1d261f;
  background:#e8c975;
}

.player-hand{
  position:absolute;

  left:50%;
  bottom:-8px;

  width:1px;
  height:145px;
}

.player-hand .card{
  position:absolute;

  left:0;
  top:20px;

  transform:
    translateX(var(--x))
    translateY(var(--y))
    rotate(var(--r));

  transition:
    transform .42s cubic-bezier(.22,.78,.22,1),
    opacity .2s,
    filter .2s,
    box-shadow .2s;
}

.player-hand .card.playable{
  cursor:pointer;
}

.player-hand .card.playable:hover{
  z-index:200!important;

  transform:
    translateX(var(--x))
    translateY(calc(var(--y) - 17px))
    rotate(var(--r))
    scale(1.035);

  box-shadow:
    0 19px 34px rgba(0,0,0,.55);
}

.player-hand .card.disabled{
  opacity:.62;
  filter:brightness(.82);
}


/* TABLE */

.table{
  position:absolute;

  left:50%;
  top:48%;

  width:min(690px,58vw);
  height:330px;

  transform:translate(-50%,-50%);

  display:grid;
  grid-template-columns:repeat(3,120px);
  grid-auto-rows:150px;

  justify-content:center;
  align-content:center;

  gap:4px 25px;

  z-index:20;
}

.pair{
  position:relative;

  width:120px;
  height:145px;

  transform:
    translate(var(--jx),var(--jy))
    rotate(var(--jr));
}

.pair .card{
  position:absolute;

  left:0;
  top:0;
}

.pair .defense{
  left:30px;
  top:27px;

  transform:rotate(8deg);
}


/* DECK */

.deck-zone{
  position:absolute;

  left:6%;
  top:55%;

  width:175px;
  height:160px;

  transform:translateY(-50%);

  z-index:30;
}

.deck-back{
  position:absolute;

  left:0;
  top:12px;

  z-index:5;
}

.deck-trump{
  position:absolute;

  left:38px;
  top:12px;

  z-index:2;

  transform:rotate(90deg);
}

.deck-count{
  position:absolute;

  left:3px;
  top:139px;

  font-size:11px;
  color:#c3cfc8;
}

.trump-symbol{
  position:absolute;

  left:110px;
  top:47px;

  font-size:34px;
}


/* DISCARD */

.discard{
  position:absolute;

  right:7%;
  bottom:24%;

  width:95px;
  height:115px;

  opacity:.85;
}

.discard-card{
  position:absolute;

  left:15px;
  top:5px;

  width:64px;
  height:89px;

  border:4px solid #eee8dc;
  border-radius:9px;

  background:
    repeating-linear-gradient(
      45deg,
      #173b67 0 5px,
      #eee6d8 5px 8px,
      #942b36 8px 13px,
      #eee6d8 13px 16px
    );

  box-shadow:0 7px 17px rgba(0,0,0,.3);
}

.discard-card:nth-child(1){
  transform:rotate(-6deg);
}

.discard-card:nth-child(2){
  transform:rotate(5deg);
}

.discard-card:nth-child(3){
  transform:rotate(-1deg);
}

.discard-label{
  position:absolute;

  left:0;
  right:0;
  bottom:-2px;

  text-align:center;

  font-size:9px;
  letter-spacing:1.5px;

  color:#aab8b1;
}


/* ACTION */

.action{
  position:absolute;

  right:6%;
  top:51%;

  display:flex;
  flex-direction:column;
  gap:8px;

  z-index:80;
}

.action button{
  min-width:110px;

  padding:11px 17px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;

  background:#eee9df;
  color:#18241e;

  font-weight:800;

  cursor:pointer;

  box-shadow:0 7px 18px rgba(0,0,0,.25);
}

.action button.red{
  color:white;
  background:#96323d;
}

.action button.gold{
  background:#e8c975;
}

.hidden{
  display:none!important;
}


/* FLY */

.flying-card{
  position:fixed!important;

  z-index:2000!important;

  margin:0!important;

  pointer-events:none!important;
}


/* MENU */

.overlay{
  position:fixed;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:500;

  background:
    radial-gradient(circle at 50% 40%,#15452f,#061a12);
}

.menu{
  width:460px;

  padding:32px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:rgba(10,35,24,.97);

  box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.menu h1{
  margin:0;

  font-size:46px;
  letter-spacing:3px;
}

.menu-sub{
  margin:6px 0 24px;

  color:#9fb0a7;
}

.setting{
  margin-top:18px;
}

.setting-title{
  margin-bottom:8px;

  font-size:11px;
  letter-spacing:1px;

  color:#9fb0a7;

  text-transform:uppercase;
}

.choice{
  display:grid;

  gap:7px;
}

.choice.two{
  grid-template-columns:repeat(2,1fr);
}

.choice.three{
  grid-template-columns:repeat(3,1fr);
}

.choice button{
  padding:11px 7px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:9px;

  background:#133627;
  color:#dbe5df;

  font-weight:800;

  cursor:pointer;
}

.choice button.active{
  color:#1e271f;

  border-color:#e8c975;
  background:#e8c975;
}

.stats{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:7px;

  margin-top:20px;
}

.stat{
  padding:9px;

  border-radius:9px;

  background:rgba(255,255,255,.035);

  text-align:center;
}

.stat b{
  display:block;

  font-size:18px;
}

.stat span{
  color:#97a89f;

  font-size:9px;
  text-transform:uppercase;
}

.start-button{
  width:100%;

  margin-top:20px;
  padding:14px;

  border:0;
  border-radius:11px;

  background:#e8c975;

  color:#1c251f;

  font-weight:900;

  cursor:pointer;
}


/* RESULT */

.result{
  width:390px;

  padding:32px;

  border-radius:23px;

  color:#17201b;
  background:#f2ede3;

  text-align:center;

  box-shadow:0 30px 90px rgba(0,0,0,.5);
}

.result-icon{
  font-size:45px;
}

.result h2{
  margin:7px 0;

  font-size:31px;
}

.result p{
  color:#665f55;
}

.result button{
  width:100%;

  padding:13px;

  border:0;
  border-radius:10px;

  background:#174b35;

  color:white;

  font-weight:900;

  cursor:pointer;
}


/* MOBILE */

@media(max-width:850px){

  .card{
    width:64px;
    height:91px;

    font-size:24px;
  }

  .corner{
    font-size:13px;
    line-height:12px;
  }

  .table{
    width:48vw;

    grid-template-columns:
      repeat(2,90px);

    grid-auto-rows:115px;
  }

  .pair{
    width:90px;
    height:115px;
  }

  .pair .defense{
    left:22px;
    top:20px;
  }

  .deck-zone{
    left:1%;

    transform:
      translateY(-50%)
      scale(.78);

    transform-origin:left center;
  }

  .opponent.left{
    left:5px;
  }

  .opponent.right{
    right:5px;
  }

  .bot-hand{
    transform:scale(.8);
  }

  .discard{
    right:1%;
    transform:scale(.8);
  }

  .action{
    right:1%;
  }

  .memory{
    display:none;
  }

  .menu{
    width:min(94vw,460px);
  }
}
</style>
</head>


<body>

<div class="game">

  <div class="header">

    <div class="logo">
      ДУРАК
      <small id="modeLabel">ПОДКИДНОЙ</small>
    </div>

    <div class="status-wrap">

      <div
        class="pill memory"
        id="memory"
      >
        Вышло 0
      </div>

      <div
        class="pill"
        id="status"
      >
        Игра
      </div>

    </div>

  </div>


  <div id="opponents"></div>


  <div class="deck-zone">

    <div
      class="deck-trump"
      id="deckTrump"
    ></div>

    <div
      class="deck-back"
      id="deckBack"
    ></div>

    <div
      class="deck-count"
      id="deckCount"
    ></div>

    <div
      class="trump-symbol"
      id="trumpSymbol"
    ></div>

  </div>


  <div
    class="table"
    id="table"
  ></div>


  <div
    class="discard"
    id="discard"
  ></div>


  <div class="action">

    <button
      id="takeButton"
      class="red hidden"
    >
      Забрать
    </button>

    <button
      id="passButton"
      class="hidden"
    >
      Пас
    </button>

  </div>


  <div class="player-area">

    <div
      class="player-name"
      id="playerName"
    >
      Ты
    </div>

    <div
      class="player-hand"
      id="playerHand"
    ></div>

  </div>

</div>


<div
  class="overlay"
  id="startOverlay"
>

  <div class="menu">

    <h1>ДУРАК</h1>

    <div class="menu-sub">
      Настрой партию
    </div>


    <div class="setting">

      <div class="setting-title">
        Режим
      </div>

      <div class="choice two">

        <button
          data-mode="throw"
          class="active"
        >
          Подкидной
        </button>

        <button
          data-mode="transfer"
        >
          Переводной
        </button>

      </div>

    </div>


    <div class="setting">

      <div class="setting-title">
        Соперники
      </div>

      <div class="choice three">

        <button
          data-opponents="1"
          class="active"
        >
          1
        </button>

        <button
          data-opponents="2"
        >
          2
        </button>

        <button
          data-opponents="3"
        >
          3
        </button>

      </div>

    </div>


    <div class="setting">

      <div class="setting-title">
        Сложность
      </div>

      <div class="choice three">

        <button
          data-difficulty="easy"
        >
          Легко
        </button>

        <button
          data-difficulty="medium"
          class="active"
        >
          Средне
        </button>

        <button
          data-difficulty="hard"
        >
          Сложно
        </button>

      </div>

    </div>


    <div class="stats">

      <div class="stat">
        <b id="wins">0</b>
        <span>Победы</span>
      </div>

      <div class="stat">
        <b id="losses">0</b>
        <span>Поражения</span>
      </div>

      <div class="stat">
        <b id="rate">0%</b>
        <span>Винрейт</span>
      </div>

    </div>


    <button
      class="start-button"
      id="startButton"
    >
      Начать игру
    </button>

  </div>

</div>


<div
  class="overlay hidden"
  id="resultOverlay"
>

  <div class="result">

    <div
      class="result-icon"
      id="resultIcon"
    ></div>

    <h2 id="resultTitle"></h2>

    <p id="resultText"></p>

    <button id="againButton">
      Играть ещё
    </button>

  </div>

</div>


<script>

/* =========================================
   CONSTANTS
========================================= */

const suits=[
  "♠",
  "♥",
  "♦",
  "♣"
];

const suitOrder=[
  "♣",
  "♦",
  "♥",
  "♠"
];

const ranks=[
  "6",
  "7",
  "8",
  "9",
  "10",
  "J",
  "Q",
  "K",
  "A"
];

const $=
  id=>document.getElementById(id);

const sleep=
  ms=>new Promise(
    resolve=>setTimeout(resolve,ms)
  );


/* =========================================
   SETTINGS
========================================= */

let gameMode="throw";
let opponentCount=1;
let difficulty="medium";


/* =========================================
   STATE
========================================= */

let players=[];

let deck=[];

let trump=null;
let bottomTrump=null;

let table=[];

let discardCount=0;

let attacker=0;
let defender=1;

let roundStartAttacker=0;

let defenderStartCards=6;

let phase="attack";

let currentThrower=0;

let passed=new Set();

let locked=false;
let gameOver=false;

let seenCards=new Set();

let humanSafe=false;


/* =========================================
   STATS
========================================= */

let stats={
  wins:0,
  losses:0
};

try{

  stats={
    ...stats,
    ...JSON.parse(
      localStorage.getItem(
        "durakMultiStats"
      )
      ||
      "{}"
    )
  };

}catch(e){}


function saveStats(){

  localStorage.setItem(
    "durakMultiStats",
    JSON.stringify(stats)
  );

  renderStats();

}


function renderStats(){

  $("wins").textContent=
    stats.wins;

  $("losses").textContent=
    stats.losses;

  const total=
    stats.wins+
    stats.losses;

  $("rate").textContent=
    (
      total
        ?Math.round(
            stats.wins/total*100
          )
        :0
    )
    +"%";

}


/* =========================================
   HELPERS
========================================= */

function isRed(suit){

  return (
    suit==="♥" ||
    suit==="♦"
  );

}


function value(card){

  return ranks.indexOf(
    card.rank
  );

}


function createDeck(){

  const out=[];

  let id=0;

  for(const suit of suits){

    for(const rank of ranks){

      out.push({
        suit,
        rank,
        id:"c"+id++
      });

    }

  }

  return out;

}


function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      array[i],
      array[j]
    ]=
    [
      array[j],
      array[i]
    ];

  }

  return array;

}


function removeCard(
  hand,
  id
){

  const index=
    hand.findIndex(
      card=>card.id===id
    );

  if(index<0)
    return null;

  return hand.splice(
    index,
    1
  )[0];

}


function activePlayers(){

  return players.filter(
    player=>player.active
  );

}


function activeCount(){

  return activePlayers().length;

}


function nextActive(index){

  if(activeCount()<=1)
    return index;

  let current=index;

  for(
    let i=0;
    i<players.length+2;
    i++
  ){

    current=
      (
        current+1
      )
      %
      players.length;

    if(
      players[current].active
    ){
      return current;
    }

  }

  return index;

}


function cycleFrom(start){

  const out=[];

  let current=start;

  for(
    let i=0;
    i<players.length;
    i++
  ){

    if(
      players[current].active
    ){
      out.push(current);
    }

    current=
      (
        current+1
      )
      %
      players.length;

  }

  return out;

}


function tableRanks(){

  const out=[];

  for(const pair of table){

    out.push(
      pair.attack.rank
    );

    if(pair.defense){

      out.push(
        pair.defense.rank
      );

    }

  }

  return out;

}


function unresolvedPair(){

  return table.find(
    pair=>!pair.defense
  );

}


function allDefended(){

  return (
    table.length>0 &&
    !unresolvedPair()
  );

}


function maxAttacks(){

  return Math.min(
    6,
    defenderStartCards
  );

}


function canThrow(card){

  if(
    table.length>=maxAttacks()
  ){
    return false;
  }

  if(!table.length)
    return true;

  return tableRanks()
    .includes(
      card.rank
    );

}


function beats(
  defenseCard,
  attackCard
){

  if(
    defenseCard.suit===
      attackCard.suit
    &&
    value(defenseCard)>
      value(attackCard)
  ){
    return true;
  }

  if(
    defenseCard.suit===trump
    &&
    attackCard.suit!==trump
  ){
    return true;
  }

  return false;

}


/* =========================================
   TRANSFER
========================================= */

function canTransfer(
  playerIndex,
  card
){

  if(
    gameMode!=="transfer"
    ||
    playerIndex!==defender
    ||
    phase!=="defense"
  ){
    return false;
  }

  /*
    Перевод только до того,
    как игрок начал отбиваться.
  */

  if(
    table.some(
      pair=>pair.defense
    )
  ){
    return false;
  }

  if(!table.length)
    return false;

  /*
    Переводим картой
    того же достоинства.
  */

  if(
    card.rank!==
      table[0].attack.rank
  ){
    return false;
  }

  if(
    table.length>=6
  ){
    return false;
  }

  const next=
    nextActive(defender);

  if(
    next===defender
  ){
    return false;
  }

  /*
    Новый защитник должен
    иметь возможность принять
    все карты.
  */

  if(
    players[next].hand.length
    <
    table.length+1
  ){
    return false;
  }

  return true;

}

function cardHTML(

){

    >

/* =========================================
   PLAYER SORTING
========================================= */

function sortedHumanHand(){

  return [
    ...players[0].hand
  ].sort(
    (a,b)=>{

      const at=
        a.suit===trump;

      const bt=
        b.suit===trump;

      /*
        Козыри справа.
      */

      if(at!==bt)
        return at?1:-1;

      /*
        Сначала достоинство.
      */

      if(
        value(a)!==
        value(b)
      ){
        return value(a)-value(b);
      }

      return (
        suitOrder.indexOf(a.suit)
        -
        suitOrder.indexOf(b.suit)
      );

    }
  );

}


/* =========================================
   HAND LAYOUT
========================================= */

function humanLayout(cards){

  const total=
    cards.length;

  const cardWidth=
    window.innerWidth<850
      ?64
      :82;

  const maxWidth=
    Math.min(
      window.innerWidth*.88,
      1000
    );

  const step=
    total<=1
      ?0
      :Math.max(
          17,
          Math.min(
            57,
            (
              maxWidth-cardWidth
            )
            /
            (
              total-1
            )
          )
        );

  const width=
    cardWidth+
    (
      total-1
    )
    *
    step;

  return cards.map(
    (
      card,
      index
    )=>{

      const rel=
        index-
        (
          total-1
        )/2;

      const strength=
        total>14
          ?.7
          :total>10
            ?1.05
            :total>7
              ?1.55
              :2.2;

      return{

        card,

        x:
          -width/2+
          index*step,

        y:
          Math.abs(rel)*
          (
            total>12
              ?.55
              :1.4
          ),

        r:
          Math.max(
            -11,
            Math.min(
              11,
              rel*strength
            )
          ),

        z:index+1

      };

    }
  );

}


function canHumanPlay(card){

  if(
    locked ||
    gameOver ||
    !players[0].active
  ){
    return false;
  }

  /*
    Ты защищаешься.
  */

  if(
    defender===0 &&
    phase==="defense"
  ){

    if(
      canTransfer(
        0,
        card
      )
    ){
      return true;
    }

    const pair=
      unresolvedPair();

    return (
      !!pair &&
      beats(
        card,
        pair.attack
      )
    );

  }

  /*
    Ты подкидываешь.
  */

  if(
    phase==="attack"
    &&
    currentThrower===0
    &&
    defender!==0
  ){

    return canThrow(card);

  }

  return false;

}

){

    return botPosition===0
      ?"left"
      :"right";

  }

  return [
    "left",
    "top",
    "right"
  ][botPosition];

}

  const r=[
    -2,1.5,-1,2,-1.7,1

  return{
    x:x[index%6],
    y:y[index%6],

  };

/* =========================================
   ANIMATION
========================================= */

async function fly(
  element,
  target,
  rotate=5
){

  if(
    !element ||
    !target
  ){
    return;
  }

  const from=
    element.getBoundingClientRect();

  const to=
    target.getBoundingClientRect();

  const clone=
    element.cloneNode(true);

  clone.classList.add(
    "flying-card"
  );

  Object.assign(
    clone.style,
    {
      left:from.left+"px",
      top:from.top+"px",
      width:from.width+"px",
      height:from.height+"px"
    }
  );

  document.body
    .appendChild(clone);

  const dx=
    to.left+
    to.width/2-
    from.width/2-
    from.left;

  const dy=
    to.top+
    to.height/2-
    from.height/2-
    from.top;

  const animation=
    clone.animate(
      [
        {
          transform:
            "translate(0,0) rotate(0)",
          opacity:1
        },
        {
          transform:
            `translate(
              ${dx*.5}px,
              ${dy*.43-65}px
            )
            rotate(${rotate*.5}deg)`,
          offset:.5
        },
        {
          transform:
            `translate(
              ${dx}px,
              ${dy}px
            )
            rotate(${rotate}deg)`,
          opacity:1
        }
      ],
      {
        duration:470,
        easing:
          "cubic-bezier(.22,.78,.22,1)",
        fill:"forwards"
      }
    );

  try{
    await animation.finished;
  }catch(e){}

  clone.remove();

}


/* =========================================
   AI
========================================= */

function cheapest(
  cards,
  avoidTrump=true
){

  return [
    ...cards
  ].sort(
    (a,b)=>{

      if(avoidTrump){

        const at=
          a.suit===trump;

        const bt=
          b.suit===trump;

        if(at!==bt)
          return at?1:-1;

      }

      return value(a)-value(b);

    }
  )[0];

}


function chooseAIAttack(
  playerIndex,
  cards
){

  if(difficulty==="easy"){

    return cheapest(
      cards,
      false
    );

  }

  const hand=
    players[playerIndex].hand;

  return [
    ...cards
  ].sort(
    (a,b)=>{

      function score(card){

        let score=
          value(card)*2;

        if(
          card.suit===trump
        ){
          score+=
            difficulty==="hard"
              ?25
              :18;
        }

        const same=
          hand.filter(
            c=>
              c.rank===card.rank
          ).length;

        score-=
          (
            same-1
          )*4;

        return score;

      }

      return score(a)-score(b);

    }
  )[0];

}


function chooseAIDefense(
  playerIndex,
  attackCard
){

  const options=
    players[playerIndex]
      .hand
      .filter(
        card=>
          beats(
            card,
            attackCard
          )
      );

  if(!options.length)
    return null;

  if(difficulty==="easy"){

    return cheapest(
      options,
      false
    );

  }

  return cheapest(
    options,
    true
  );

}


function aiWantsTransfer(
  playerIndex,
  card
){

  if(
    gameMode!=="transfer"
    ||
    difficulty==="easy"
  ){
    return false;
  }

  if(
    !canTransfer(
      playerIndex,
      card
    )
  ){
    return false;
  }

  if(difficulty==="hard")
    return true;

  return (
    card.suit!==trump
  );

}


/* =========================================
   ROUND
========================================= */

function createPlayers(){

  players=[
    {
      id:"human",
      name:"Ты",
      human:true,
      active:true,
      hand:[]
    }
  ];

  for(
    let i=1;
    i<=opponentCount;
    i++
  ){

    players.push({
      id:"cpu"+i,
      name:"CPU "+i,
      human:false,
      active:true,
      hand:[]
    });

  }

}


function findLowestTrumpPlayer(){

  let winner=null;

  let best=999;

  players.forEach(
    (
      player,
      index
    )=>{

      const trumps=
        player.hand
          .filter(
            card=>
              card.suit===trump
          );

      if(!trumps.length)
        return;

      const low=
        Math.min(
          ...trumps.map(value)
        );

      if(low<best){

        best=low;
        winner=index;

      }

    }
  );

  return winner===null
    ?0
    :winner;

}


function startRound(
  newAttacker
){

  attacker=
    newAttacker;

  defender=
    nextActive(attacker);

  roundStartAttacker=
    attacker;

  defenderStartCards=
    players[defender]
      .hand
      .length;

  table=[];

  phase="attack";

  passed=
    new Set();

  currentThrower=
    attacker;

  locked=false;

  render();

  scheduleCurrentAction();

}


/* =========================================
   THROWER ORDER
========================================= */

function eligibleThrowers(){

  return cycleFrom(
    roundStartAttacker
  ).filter(
    index=>
      index!==defender
      &&
      players[index].active
  );

}


function nextThrowerAfter(
  current
){

  const list=
    eligibleThrowers();

  const pos=
    list.indexOf(current);

  if(pos<0)
    return list[0];

  return list[
    (
      pos+1
    )
    %
    list.length
  ];

}


function allThrowersPassed(){

  const throwers=
    eligibleThrowers();

  return throwers.every(
    index=>
      passed.has(index)
  );

}


function moveToNextThrower(){

  if(
    table.length>=maxAttacks()
  ){

    finishSuccessfulDefense();
    return;

  }

  if(
    allThrowersPassed()
  ){

    finishSuccessfulDefense();
    return;

  }

  let next=
    nextThrowerAfter(
      currentThrower
    );

  let safety=0;

  while(
    passed.has(next)
    &&
    safety<players.length+2
  ){

    next=
      nextThrowerAfter(next);

    safety++;

  }

  currentThrower=
    next;

  phase="attack";

  render();

  scheduleCurrentAction();

}


/* =========================================
   PLAY ATTACK
========================================= */

async function playAttackCard(
  playerIndex,
  card
){

  if(
    locked ||
    phase!=="attack" ||
    currentThrower!==playerIndex ||
    !canThrow(card)
  ){
    return;
  }

  locked=true;

  const source=
    playerIndex===0
      ?document.querySelector(
          `#playerHand [data-id="${card.id}"]`
        )
      :null;

  if(source){

    await fly(
      source,
      $("table"),
      4
    );

  }

  const played=
    removeCard(
      players[playerIndex].hand,
      card.id
    );

  seenCards.add(
    played.id
  );

  table.push({
    attack:played,
    defense:null
  });

  /*
    После нового подкидывания
    предыдущие пасы сбрасываются.
  */

  passed=
    new Set();

  phase="defense";

  locked=false;

  render();

  scheduleCurrentAction();

}


/* =========================================
   DEFENSE
========================================= */

async function defendWith(
  playerIndex,
  card
){

  if(
    locked ||
    playerIndex!==defender ||
    phase!=="defense"
  ){
    return;
  }

  const pair=
    unresolvedPair();

  if(!pair)
    return;


  /*
    Перевод.
  */

  if(
    canTransfer(
      playerIndex,
      card
    )
  ){

    await transferAttack(
      playerIndex,
      card
    );

    return;

  }


  if(
    !beats(
      card,
      pair.attack
    )
  ){
    return;
  }


  locked=true;


  const source=
    playerIndex===0
      ?document.querySelector(
          `#playerHand [data-id="${card.id}"]`
        )
      :null;


  if(source){

    await fly(
      source,
      $("table"),
      5
    );

  }


  pair.defense=
    removeCard(
      players[playerIndex].hand,
      card.id
    );


  seenCards.add(
    pair.defense.id
  );


  locked=false;


  /*
    Если есть ещё неотбитая
    карта, продолжаем защиту.
  */

  if(
    unresolvedPair()
  ){

    phase="defense";

  }

  else{

    phase="attack";

    currentThrower=
      roundStartAttacker;

  }


  render();

  scheduleCurrentAction();

}


/* =========================================
   TRANSFER ACTION
========================================= */

async function transferAttack(
  oldDefender,
  card
){

  if(
    !canTransfer(
      oldDefender,
      card
    )
  ){
    return;
  }


  locked=true;


  const source=
    oldDefender===0
      ?document.querySelector(
          `#playerHand [data-id="${card.id}"]`
        )
      :null;


  if(source){

    await fly(
      source,
      $("table"),
      5
    );

  }


  const played=
    removeCard(
      players[oldDefender].hand,
      card.id
    );


  seenCards.add(
    played.id
  );


  table.push({
    attack:played,
    defense:null
  });


  /*
    Защита переходит
    следующему игроку.
  */

  defender=
    nextActive(
      oldDefender
    );


  defenderStartCards=
    players[defender]
      .hand
      .length;


  phase="defense";


  passed=
    new Set();


  locked=false;


  render();


  scheduleCurrentAction();

}


/* =========================================
   TAKE
========================================= */

async function defenderTakes(){

  if(
    locked ||
    phase!=="defense"
  ){
    return;
  }


  locked=true;


  await sleep(250);


  for(const pair of table){

    players[defender]
      .hand
      .push(
        pair.attack
      );

    if(pair.defense){

      players[defender]
        .hand
        .push(
          pair.defense
        );

    }

  }


  const oldDefender=
    defender;


  table=[];


  /*
    После взятия атакует
    следующий после взявшего.
  */

  await refillRound(
    oldDefender
  );


  removeFinishedPlayers();


  if(
    checkEndGame()
  ){
    return;
  }


  const nextAttacker=
    nextActive(
      oldDefender
    );


  startRound(
    nextAttacker
  );

}


/* =========================================
   SUCCESS
========================================= */

async function finishSuccessfulDefense(){

  if(
    locked ||
    !allDefended()
  ){
    return;
  }


  locked=true;


  discardCount+=
    table.reduce(
      (
        total,
        pair
      )=>
        total+
        1+
        (
          pair.defense
            ?1
            :0
        ),
      0
    );


  const oldDefender=
    defender;


  table=[];


  await refillRound(
    oldDefender
  );


  removeFinishedPlayers();


  if(
    checkEndGame()
  ){
    return;
  }


  /*
    Отбившийся начинает
    следующий кон.
  */

  if(
    players[oldDefender].active
  ){

    startRound(
      oldDefender
    );

  }

  else{

    startRound(
      nextActive(
        oldDefender
      )
    );

  }

}


/* =========================================
   REFILL
========================================= */

async function refillRound(
  finalDefender
){

  /*
    Сначала атакующие
    начиная с начального
    атакующего.
    Защитник последний.
  */

  const order=
    cycleFrom(
      roundStartAttacker
    )
    .filter(
      index=>
        index!==finalDefender
    );


  order.push(
    finalDefender
  );


  for(const index of order){

    if(
      !players[index].active
    ){
      continue;
    }

    while(
      players[index]
        .hand
        .length<6
      &&
      deck.length
    ){

      players[index]
        .hand
        .push(
          deck.shift()
        );

      render();

      await sleep(65);

    }

  }

}


/* =========================================
   PLAYER ELIMINATION
========================================= */

function removeFinishedPlayers(){

  if(deck.length)
    return;


  players.forEach(
    (
      player,
      index
    )=>{

      if(
        player.active
        &&
        player.hand.length===0
      ){

        player.active=false;

        if(index===0){

          humanSafe=true;

        }

      }

    }
  );

}


/* =========================================
   END GAME
========================================= */

function checkEndGame(){

  /*
    Игрок уже вышел.
    Для него партия закончена.
  */

  if(humanSafe){

    gameOver=true;

    stats.wins++;

    saveStats();

    showResult(
      true,
      "Ты вышел из игры",
      "У тебя закончились карты. Ты не дурак."
    );

    return true;

  }


  const active=
    activePlayers();


  if(active.length<=1){

    gameOver=true;


    if(
      active.length===1
      &&
      active[0].human
    ){

      stats.losses++;

      saveStats();

      showResult(
        false,
        "Ты дурак",
        "Все соперники избавились от карт раньше."
      );

    }

    else{

      stats.wins++;

      saveStats();

      showResult(
        true,
        "Победа",
        "Ты не остался последним."
      );

    }


    return true;

  }


  return false;

}


function showResult(
  win,
  title,
  text
){

  $("resultIcon").textContent=
    win
      ?"🏆"
      :"🃏";

  $("resultTitle").textContent=
    title;

  $("resultText").textContent=
    text;

  $("resultOverlay")
    .classList
    .remove(
      "hidden"
    );

}


/* =========================================
   AI TURN
========================================= */

async function aiAttack(
  playerIndex
){

  await sleep(
    difficulty==="hard"
      ?450
      :difficulty==="medium"
        ?580
        :700
  );


  if(
    phase!=="attack"
    ||
    currentThrower!==playerIndex
  ){
    return;
  }


  const options=
    players[playerIndex]
      .hand
      .filter(
        canThrow
      );


  if(
    !options.length
    ||
    (
      table.length>0
      &&
      difficulty==="easy"
      &&
      Math.random()<.35
    )
  ){

    passed.add(
      playerIndex
    );

    moveToNextThrower();

    return;

  }


  const card=
    chooseAIAttack(
      playerIndex,
      options
    );


  await playAttackCard(
    playerIndex,
    card
  );

}


async function aiDefend(
  playerIndex
){

  await sleep(
    difficulty==="hard"
      ?430
      :difficulty==="medium"
        ?550
        :700
  );


  const pair=
    unresolvedPair();

  if(
    !pair
    ||
    defender!==playerIndex
    ||
    phase!=="defense"
  ){
    return;
  }


  /*
    Сначала ищем перевод.
  */

  if(
    gameMode==="transfer"
  ){

    const transfers=
      players[playerIndex]
        .hand
        .filter(
          card=>
            canTransfer(
              playerIndex,
              card
            )
        );


    if(transfers.length){

      const card=
        cheapest(
          transfers,
          true
        );


      if(
        aiWantsTransfer(
          playerIndex,
          card
        )
      ){

        await transferAttack(
          playerIndex,
          card
        );

        return;

      }

    }

  }


  const defense=
    chooseAIDefense(
      playerIndex,
      pair.attack
    );


  /*
    Иногда умный бот
    предпочитает забрать,
    чтобы не сжечь
    сильный козырь.
  */

  if(
    defense
    &&
    difficulty==="hard"
    &&
    defense.suit===trump
    &&
    pair.attack.suit!==trump
    &&
    value(defense)>=7
    &&
    players[playerIndex]
      .hand
      .length>4
    &&
    Math.random()<.3
  ){

    await defenderTakes();

    return;

  }


  if(!defense){

    await defenderTakes();

    return;

  }


  await defendWith(
    playerIndex,
    defense
  );

}


/* =========================================
   SCHEDULER
========================================= */

function scheduleCurrentAction(){

  if(
    gameOver ||
    locked
  ){
    return;
  }


  render();


  /*
    Защита.
  */

  if(
    phase==="defense"
  ){

    if(defender===0){

      return;

    }

    aiDefend(
      defender
    );

    return;

  }


  /*
    Подкидывание.
  */

  if(
    currentThrower===0
  ){

    return;

  }


  aiAttack(
    currentThrower
  );

}


/* =========================================
   HUMAN CLICK
========================================= */

$("playerHand")
  .addEventListener(
    "click",
    async event=>{

      const element=
        event.target.closest(
          ".card[data-id]"
        );

      if(!element)
        return;


      const card=
        players[0]
          .hand
          .find(
            card=>
              card.id===
              element.dataset.id
          );


      if(!card)
        return;


      if(
        defender===0
        &&
        phase==="defense"
      ){

        await defendWith(
          0,
          card
        );

        return;

      }


      if(
        phase==="attack"
        &&
        currentThrower===0
        &&
        defender!==0
      ){

        await playAttackCard(
          0,
          card
        );

      }

    }
  );


/* =========================================
   HUMAN BUTTONS
========================================= */

$("takeButton").onclick=
  ()=>{

    if(
      defender===0
      &&
      phase==="defense"
    ){

      defenderTakes();

    }

  };


$("passButton").onclick=
  ()=>{

    if(
      phase!=="attack"
      ||
      currentThrower!==0
    ){
      return;
    }

    passed.add(0);

    moveToNextThrower();

  };


/* =========================================
   INITIAL DEAL
========================================= */

async function initialDeal(){

  for(
    let round=0;
    round<6;
    round++
  ){

    for(
      let i=0;
      i<players.length;
      i++
    ){

      if(!deck.length)
        break;

      players[i]
        .hand
        .push(
          deck.shift()
        );

      render();

      await sleep(70);

    }

  }

}


/* =========================================
   START
========================================= */

async function startGame(){

  gameOver=false;
  locked=true;

  humanSafe=false;

  seenCards=
    new Set();

  discardCount=0;

  table=[];


  createPlayers();


  deck=
    shuffle(
      createDeck()
    );


  bottomTrump=
    deck[
      deck.length-1
    ];


  trump=
    bottomTrump.suit;


  $("modeLabel").textContent=
    gameMode==="transfer"
      ?"ПЕРЕВОДНОЙ"
      :"ПОДКИДНОЙ";


  $("startOverlay")
    .classList
    .add(
      "hidden"
    );


  $("resultOverlay")
    .classList
    .add(
      "hidden"
    );


  render();


  await initialDeal();


  attacker=
    findLowestTrumpPlayer();


  defender=
    nextActive(attacker);


  locked=false;


  startRound(
    attacker
  );

}


/* =========================================
   SETTINGS UI
========================================= */

function setupChoice(
  selector,
  callback
){

  document
    .querySelectorAll(
      selector
    )
    .forEach(
      button=>{

        button.onclick=
          ()=>{

            document
              .querySelectorAll(
                selector
              )
              .forEach(
                item=>
                  item
                    .classList
                    .remove(
                      "active"
                    )
              );


            button
              .classList
              .add(
                "active"
              );


            callback(
              button
            );

          };

      }
    );

}


setupChoice(
  "[data-mode]",
  button=>{

    gameMode=
      button.dataset.mode;

  }
);


setupChoice(
  "[data-opponents]",
  button=>{

    opponentCount=
      Number(
        button.dataset.opponents
      );

  }
);


setupChoice(
  "[data-difficulty]",
  button=>{

    difficulty=
      button.dataset.difficulty;

  }
);


$("startButton").onclick=
  startGame;


$("againButton").onclick=
  ()=>{

    $("resultOverlay")
      .classList
      .add(
        "hidden"
      );

    $("startOverlay")
      .classList
      .remove(
        "hidden"
      );

  };


renderStats();
