<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дурак</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  background:#06150f;
  color:#fff;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:650px;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      #1b6847 0,
      #104a34 38%,
      #0a3022 70%,
      #061911 100%
    );
}

.game:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.16;

  background-image:
    repeating-linear-gradient(
      35deg,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 4px
    ),
    repeating-linear-gradient(
      -35deg,
      rgba(0,0,0,.04) 0 1px,
      transparent 1px 5px
    );
}

.game:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 48%,
      transparent 45%,
      rgba(0,0,0,.2) 100%
    );
}


/* HEADER */

.header{
  position:absolute;
  top:18px;
  left:24px;
  right:24px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  z-index:50;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:2px;

  text-shadow:
    0 3px 12px rgba(0,0,0,.4);
}

.logo small{
  display:block;
  margin-top:3px;

  font-size:9px;
  letter-spacing:4px;

  color:#e6ca7d;
}

.status{
  padding:10px 16px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:rgba(6,26,18,.72);

  backdrop-filter:blur(8px);

  box-shadow:
    0 8px 25px rgba(0,0,0,.18);

  font-size:13px;
  color:#eef4f0;
}


/* CARDS */

.card{
  width:84px;
  height:118px;

  position:relative;

  flex:0 0 auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  border:1px solid #cfc7ba;

  background:
    linear-gradient(
      145deg,
      #fffefa,
      #eee8de
    );

  color:#171717;

  font-size:32px;
  font-weight:700;

  box-shadow:
    0 10px 23px rgba(0,0,0,.44);

  user-select:none;

  transform-origin:center bottom;
}

.card.red{
  color:#c92735;
}

.corner{
  position:absolute;

  left:8px;
  top:7px;

  font-size:17px;
  line-height:16px;

  text-align:center;
}

.corner span{
  display:block;

  font-size:16px;
}

.corner.bottom{
  left:auto;
  top:auto;

  right:8px;
  bottom:7px;

  transform:rotate(180deg);
}

.card.back{
  border:5px solid #eee8dc;

  background:
    repeating-linear-gradient(
      45deg,
      #173b67 0 5px,
      #eee6d8 5px 8px,
      #942b36 8px 13px,
      #eee6d8 13px 16px
    );
}


/* HANDS */

.hand{
  position:absolute;

  left:50%;

  display:flex;
  justify-content:center;

  transform:translateX(-50%);

  z-index:30;
}

.cpu-hand{
  top:66px;

  align-items:flex-start;
}

.player-hand{
  bottom:-10px;

  min-height:170px;

  padding-top:28px;

  align-items:flex-end;
}

.hand .card{
  margin-left:-31px;
}

.hand .card:first-child{
  margin-left:0;
}


/* FAN */

.player-hand .card,
.cpu-hand .card{
  transform:
    rotate(var(--rot,0deg))
    translateY(var(--drop,0px));

  transition:
    transform .32s cubic-bezier(.22,.8,.25,1),
    box-shadow .22s ease,
    opacity .22s ease,
    filter .22s ease;
}

.player-hand .card.playable{
  cursor:pointer;
}

.player-hand .card.playable:hover{
  z-index:100;

  transform:
    rotate(var(--rot,0deg))
    translateY(calc(var(--drop,0px) - 17px))
    scale(1.035);

  box-shadow:
    0 18px 34px rgba(0,0,0,.52);
}

.player-hand .card.disabled{
  opacity:.68;

  filter:
    brightness(.86)
    saturate(.9);
}


/* TRUMP GROUP */

.player-hand .card.first-trump{
  margin-left:4px;
}


/* TABLE */

.table{
  position:absolute;

  left:50%;
  top:46%;

  transform:translate(-50%,-50%);

  width:min(770px,68vw);
  min-height:320px;

  display:flex;
  justify-content:center;
  align-items:center;
  align-content:center;

  flex-wrap:wrap;

  gap:12px 18px;

  z-index:15;
}

.pair{
  width:120px;
  height:154px;

  position:relative;
}

.pair .card{
  position:absolute;

  left:0;
  top:5px;

  margin:0;
}

.pair .card.defense{
  left:30px;
  top:28px;

  transform:rotate(8deg);
}


/* DECK */

.deck-zone{
  position:absolute;

  left:6%;
  top:46%;

  transform:translateY(-50%);

  width:180px;
  height:175px;

  z-index:12;
}

.deck-card{
  position:absolute;

  left:0;
  top:18px;

  z-index:4;
}

.deck-card .card,
.deck-trump .card{
  margin:0;
}

.deck-trump{
  position:absolute;

  left:40px;
  top:18px;

  z-index:1;

  transform:rotate(90deg);
}

.deck-count{
  position:absolute;

  left:4px;
  top:145px;

  font-size:11px;

  color:#c4d0ca;
}

.trump-label{
  position:absolute;

  left:111px;
  top:43px;

  font-size:9px;
  letter-spacing:1.8px;

  text-transform:uppercase;

  color:#aebcb5;
}

.trump-symbol{
  position:absolute;

  left:114px;
  top:59px;

  font-size:32px;
}


/* DISCARD */

.discard{
  position:absolute;

  right:7%;
  bottom:25%;

  width:105px;
  height:135px;

  z-index:10;

  opacity:.86;
}

.discard-card{
  position:absolute;

  width:70px;
  height:98px;

  left:17px;
  top:10px;

  border:4px solid #eae4d8;
  border-radius:9px;

  background:
    repeating-linear-gradient(
      45deg,
      #173b67 0 5px,
      #eee6d8 5px 8px,
      #942b36 8px 13px,
      #eee6d8 13px 16px
    );

  box-shadow:
    0 8px 18px rgba(0,0,0,.32);
}

.discard-card:nth-child(1){
  transform:rotate(-7deg);
}

.discard-card:nth-child(2){
  transform:rotate(5deg);
}

.discard-card:nth-child(3){
  transform:rotate(-1deg);
}

.discard-label{
  position:absolute;

  left:0;
  right:0;
  bottom:-3px;

  text-align:center;

  font-size:9px;
  letter-spacing:2px;

  text-transform:uppercase;

  color:#aab8b1;
}


/* ACTION */

.action{
  position:absolute;

  right:6%;
  top:46%;

  transform:translateY(-50%);

  z-index:40;
}

.action button{
  min-width:112px;

  padding:12px 20px;

  border:1px solid rgba(255,255,255,.14);
  border-radius:10px;

  background:#eee9df;

  color:#18241e;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 7px 18px rgba(0,0,0,.25);

  transition:
    transform .14s ease,
    filter .14s ease;
}

.action button:hover{
  transform:translateY(-2px);

  filter:brightness(1.05);
}

.action button.danger{
  background:#96323d;

  color:#fff;
}

.hidden{
  display:none!important;
}


/* FLYING CARD */

.flying-card{
  position:fixed!important;

  z-index:1000!important;

  margin:0!important;

  pointer-events:none!important;

  will-change:
    transform,
    opacity;
}


/* START / RESULT */

.start-screen,
.result-overlay{
  position:fixed;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:200;

  background:
    radial-gradient(
      circle at 50% 40%,
      #15452f,
      #061a12
    );
}

.start-box{
  width:390px;

  padding:34px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:rgba(10,35,24,.96);

  box-shadow:
    0 30px 80px rgba(0,0,0,.5);
}

.start-box h1{
  margin:0;

  font-size:46px;
  letter-spacing:3px;
}

.start-box p{
  margin:8px 0 28px;

  color:#aab9b1;

  line-height:1.45;
}

.start-box button,
.result-box button{
  width:100%;

  padding:14px;

  border:0;
  border-radius:11px;

  background:#e8c975;

  color:#1b231e;

  font-weight:900;

  cursor:pointer;
}

.result-overlay{
  z-index:300;

  background:rgba(2,12,8,.74);

  backdrop-filter:blur(7px);
}

.result-box{
  width:390px;

  padding:34px;

  text-align:center;

  border-radius:25px;

  color:#17201b;

  background:
    linear-gradient(
      145deg,
      #fffdf6,
      #e9e2d4
    );

  box-shadow:
    0 30px 90px rgba(0,0,0,.54);
}

.result-icon{
  font-size:46px;
}

.result-title{
  margin:8px 0 0;

  font-size:31px;
}

.result-text{
  margin:8px 0 22px;

  color:#655f56;
}

.result-box button{
  background:#174b35;

  color:#fff;
}


/* RESPONSIVE */

@media(max-width:850px){

  .card{
    width:66px;
    height:94px;

    font-size:25px;
  }

  .corner{
    font-size:14px;
    line-height:13px;
  }

  .corner span{
    font-size:13px;
  }

  .hand .card{
    margin-left:-27px;
  }

  .player-hand .card.first-trump{
    margin-left:0;
  }

  .table{
    width:58vw;

    gap:8px;
  }

  .pair{
    width:90px;
    height:120px;
  }

  .pair .card.defense{
    left:23px;
    top:22px;
  }

  .deck-zone{
    left:2%;

    transform:
      translateY(-50%)
      scale(.82);

    transform-origin:left center;
  }

  .discard{
    right:2%;

    transform:scale(.8);

    transform-origin:right bottom;
  }

  .action{
    right:2%;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="header">

    <div class="logo">
      ДУРАК
      <small>ПОДКИДНОЙ</small>
    </div>

    <div
      class="status"
      id="status"
    >
      Начинаем...
    </div>

  </div>


  <div
    class="hand cpu-hand"
    id="cpuHand"
  ></div>


  <div class="deck-zone">

    <div
      class="deck-trump"
      id="deckTrump"
    ></div>

    <div
      class="deck-card"
      id="deckCard"
    ></div>

    <div
      class="deck-count"
      id="deckCount"
    ></div>

    <div class="trump-label">
      Козырь
    </div>

    <div
      class="trump-symbol"
      id="trumpSymbol"
    ></div>

  </div>


  <div
    class="table"
    id="table"
  ></div>


  <div
    class="discard"
    id="discard"
  >
    <div class="discard-label">
      Бито
    </div>
  </div>


  <div class="action">

    <button
      id="actionButton"
      class="hidden"
    ></button>

  </div>


  <div
    class="hand player-hand"
    id="playerHand"
  ></div>

</div>


<div
  class="start-screen"
  id="startScreen"
>

  <div class="start-box">

    <h1>ДУРАК</h1>

    <p>
      Классический подкидной Дурак.
      Колода 36 карт.
    </p>

    <button id="startButton">
      Начать игру
    </button>

  </div>

</div>


<div
  class="result-overlay hidden"
  id="resultOverlay"
>

  <div class="result-box">

    <div
      class="result-icon"
      id="resultIcon"
    ></div>

    <h2
      class="result-title"
      id="resultTitle"
    ></h2>

    <div
      class="result-text"
      id="resultText"
    ></div>

    <button id="againButton">
      Играть ещё
    </button>

  </div>

</div>


<script>

const suits=[
  "♠",
  "♥",
  "♦",
  "♣"
];

const suitOrder=[
  "♣",
  "♦",
  "♥",
  "♠"
];

const ranks=[
  "6",
  "7",
  "8",
  "9",
  "10",
  "J",
  "Q",
  "K",
  "A"
];


let deck=[];
let player=[];
let cpu=[];
let table=[];

let discardCount=0;

let trump=null;
let bottomTrump=null;

let attacker="player";
let defender="cpu";

let defenderTaking=false;
let defenderStartCards=6;

let gameOver=false;
let locked=false;

let audioCtx=null;


const $=
  id=>
    document.getElementById(id);


const sleep=
  ms=>
    new Promise(
      resolve=>
        setTimeout(
          resolve,
          ms
        )
    );


function isRed(suit){

  return (
    suit==="♥"
    ||
    suit==="♦"
  );

}


function value(card){

  return ranks.indexOf(
    card.rank
  );

}


/* SOUND */

function sound(kind){

  try{

    if(!audioCtx){

      audioCtx=
        new (
          window.AudioContext
          ||
          window.webkitAudioContext
        )();

    }


    const oscillator=
      audioCtx.createOscillator();


    const gain=
      audioCtx.createGain();


    oscillator.type=
      "triangle";


    oscillator.frequency.value=

      kind==="take"

        ?160

        :kind==="beat"

          ?520

          :320;


    gain.gain.setValueAtTime(
      .018,
      audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+.075
    );


    oscillator
      .connect(gain)
      .connect(
        audioCtx.destination
      );


    oscillator.start();


    oscillator.stop(
      audioCtx.currentTime+.08
    );

  }

  catch(error){}

}


/* DECK */

function createDeck(){

  const result=[];

  let id=0;


  for(
    const suit
    of suits
  ){

    for(
      const rank
      of ranks
    ){

      result.push({

        suit,

        rank,

        id:
          "card_"+id++

      });

    }

  }


  return result;

}


function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*
        (i+1)
      );


    [
      array[i],
      array[j]
    ]=
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


function removeCard(
  hand,
  id
){

  const index=

    hand.findIndex(
      card=>
        card.id===id
    );


  if(
    index<0
  ){

    return null;

  }


  return hand.splice(
    index,
    1
  )[0];

}


/* CARD HTML */

function cardHTML(
  card,
  back=false,
  extra="",
  style=""
){

  if(back){

    return `

      <div
        class="
          card
          back
          ${extra}
        "

        style="${style}"
      ></div>

    `;

  }


  return `

    <div
      class="
        card
        ${isRed(card.suit)?"red":""}
        ${extra}
      "

      data-id="${card.id}"

      style="${style}"
    >

      <div class="corner">

        ${card.rank}

        <span>
          ${card.suit}
        </span>

      </div>

      ${card.suit}

      <div class="corner bottom">

        ${card.rank}

        <span>
          ${card.suit}
        </span>

      </div>

    </div>

  `;

}


/* SORTING */

function sortedPlayerHand(){

  return [
    ...player
  ].sort(
    (a,b)=>{

      const aTrump=
        a.suit===trump;

      const bTrump=
        b.suit===trump;


      /* козыри справа */

      if(
        aTrump!==bTrump
      ){

        return (
          aTrump
            ?1
            :-1
        );

      }


      /* 6, 7, 8, 9... */

      if(
        value(a)!==
        value(b)
      ){

        return (
          value(a)
          -
          value(b)
        );

      }


      /* одинаковые значения рядом */

      return (
        suitOrder.indexOf(
          a.suit
        )
        -
        suitOrder.indexOf(
          b.suit
        )
      );

    }
  );

}


/* RULES */

function beats(
  defenseCard,
  attackCard
){

  return (

    (
      defenseCard.suit===
        attackCard.suit

      &&

      value(defenseCard)>
        value(attackCard)
    )

    ||

    (
      defenseCard.suit===
        trump

      &&

      attackCard.suit!==
        trump
    )

  );

}


function tableRanks(){

  const result=[];


  for(
    const pair
    of table
  ){

    result.push(
      pair.attack.rank
    );


    if(
      pair.defense
    ){

      result.push(
        pair.defense.rank
      );

    }

  }


  return result;

}


function maxAttacks(){

  return Math.min(
    6,
    defenderStartCards
  );

}


function canAttack(card){

  return (

    table.length<
      maxAttacks()

    &&

    (
      !table.length

      ||

      tableRanks()
        .includes(
          card.rank
        )
    )

  );

}


function canPlayerPlay(card){

  if(
    gameOver
    ||
    locked
  ){

    return false;

  }


  if(
    attacker==="player"
  ){

    if(
      !defenderTaking

      &&

      table.some(
        pair=>
          !pair.defense
      )
    ){

      return false;

    }


    return canAttack(
      card
    );

  }


  if(
    defender==="player"
    &&
    !defenderTaking
  ){

    const pair=

      table.find(
        pair=>
          !pair.defense
      );


    return (

      !!pair

      &&

      beats(
        card,
        pair.attack
      )

    );

  }


  return false;

}


/* FAN */

function fanStyle(
  index,
  total,
  inverted=false
){

  if(
    total<=1
  ){

    return `
      --rot:0deg;
      --drop:0px
    `;

  }


  const middle=
    (total-1)/2;


  const relative=
    index-middle;


  /*
    Наклон стал мягче,
    чем в прошлой версии.
  */

  const rotation=

    relative
    *
    2.4
    *
    (
      inverted
        ?-1
        :1
    );


  const drop=

    Math.abs(
      relative
    )
    *
    1.8;


  return `

    --rot:${rotation}deg;
    --drop:${drop}px

  `;

}


/* RENDER */

function renderCPU(){

  const total=
    cpu.length;


  $("cpuHand")
    .innerHTML=

    cpu
      .map(
        (
          card,
          index
        )=>

          cardHTML(
            null,
            true,
            "",
            fanStyle(
              index,
              total,
              true
            )
          )
      )
      .join("");

}


function renderPlayer(){

  const hand=
    sortedPlayerHand();


  const total=
    hand.length;


  const firstTrump=

    hand.findIndex(
      card=>
        card.suit===trump
    );


  $("playerHand")
    .innerHTML=

    hand
      .map(
        (
          card,
          index
        )=>{

          let classes=

            canPlayerPlay(
              card
            )

              ?"playable"

              :"disabled";


          if(
            index===
              firstTrump

            &&

            firstTrump>0
          ){

            classes+=
              " first-trump";

          }


          return cardHTML(

            card,

            false,

            classes,

            fanStyle(
              index,
              total
            )

          );

        }
      )
      .join("");

}


function renderTable(){

  $("table")
    .innerHTML=

    table
      .map(
        pair=>`

          <div class="pair">

            ${
              cardHTML(
                pair.attack
              )
            }

            ${
              pair.defense

                ?

                  cardHTML(
                    pair.defense,
                    false,
                    "defense"
                  )

                :

                  ""
            }

          </div>

        `
      )
      .join("");

}


function renderDeck(){

  $("deckCard")
    .innerHTML=

    deck.length

      ?

        cardHTML(
          null,
          true
        )

      :

        "";


  $("deckTrump")
    .innerHTML=

    deck.includes(
      bottomTrump
    )

      ?

        cardHTML(
          bottomTrump
        )

      :

        "";


  $("deckCount")
    .textContent=

    deck.length

      ?

        `В колоде: ${deck.length}`

      :

        "";


  $("trumpSymbol")
    .textContent=
      trump || "";


  $("trumpSymbol")
    .style.color=

    isRed(trump)

      ?

        "#e44c59"

      :

        "#fff";

}


function renderDiscard(){

  const count=

    Math.min(
      3,
      Math.ceil(
        discardCount/2
      )
    );


  $("discard")
    .innerHTML=

    Array.from(
      {
        length:count
      },

      ()=>
        '<div class="discard-card"></div>'

    ).join("")

    +

    `

      <div class="discard-label">

        ${
          discardCount

            ?

              `Бито · ${discardCount}`

            :

              "Бито"
        }

      </div>

    `;

}


function renderStatus(){

  let text="";


  if(gameOver){

    text=
      "Игра окончена";

  }

  else if(
    defenderTaking
  ){

    text=

      defender==="player"

        ?

          "Ты забираешь"

        :

          "Компьютер забирает";

  }

  else if(
    attacker==="player"
  ){

    text=
      "Твой ход";

  }

  else{

    text=

      table.some(
        pair=>
          !pair.defense
      )

        ?

          "Отбейся"

        :

          "Ход компьютера";

  }


  $("status")
    .textContent=

      `${text} · ${trump}`;

}


function renderAction(){

  const button=
    $("actionButton");


  button.className=
    "hidden";


  button.onclick=
    null;


  if(
    gameOver
    ||
    locked
  ){

    return;

  }


  if(
    defender==="player"
    &&
    !defenderTaking

    &&

    table.some(
      pair=>
        !pair.defense
    )
  ){

    button.textContent=
      "Забрать";

    button.className=
      "danger";

    button.onclick=
      playerTake;

    return;

  }


  if(
    attacker==="player"
    &&
    defenderTaking
  ){

    button.textContent=
      "Закончить";

    button.className="";

    button.onclick=
      finishTake;

    return;

  }


  if(
    attacker==="player"

    &&

    table.length

    &&

    table.every(
      pair=>
        pair.defense
    )
  ){

    button.textContent=
      "Бито";

    button.className="";

    button.onclick=
      successfulDefense;

  }

}


function render(){

  renderCPU();

  renderPlayer();

  renderTable();

  renderDeck();

  renderDiscard();

  renderAction();

  renderStatus();

}


/* =====================================
   NEW SMOOTH ANIMATION ENGINE
===================================== */

function makeGhost(element){

  const rect=
    element.getBoundingClientRect();


  const clone=
    element.cloneNode(
      true
    );


  clone.classList.add(
    "flying-card"
  );


  clone.style.left=
    rect.left+"px";


  clone.style.top=
    rect.top+"px";


  clone.style.width=
    rect.width+"px";


  clone.style.height=
    rect.height+"px";


  clone.style.transform=
    "none";


  document.body
    .appendChild(
      clone
    );


  return {

    clone,

    rect

  };

}


/*
  Плавный полёт по дуге.
*/

async function arcFlight(
  element,
  target,
  options={}
){

  if(
    !element
    ||
    !target
  ){

    return;

  }


  const duration=
    options.duration ?? 620;


  const lift=
    options.lift ?? 90;


  const rotate=
    options.rotate ?? 6;


  const scale=
    options.scale ?? .98;


  const fade=
    options.fade ?? false;


  const {
    clone,
    rect:from
  }=
    makeGhost(
      element
    );


  const to=
    target.getBoundingClientRect();


  const x0=
    from.left;


  const y0=
    from.top;


  const x1=

    to.left
    +
    to.width/2
    -
    from.width/2;


  const y1=

    to.top
    +
    to.height/2
    -
    from.height/2;


  const dx=
    x1-x0;


  const dy=
    y1-y0;


  /*
    Средняя точка
    находится выше прямой,
    поэтому траектория
    ощущается дугой.
  */

  const midX=
    dx*.52;


  const midY=
    dy*.46-lift;


  const animation=

    clone.animate(
      [

        {
          transform:
            "translate(0px,0px) rotate(0deg) scale(1)",

          opacity:1,

          offset:0
        },

        {
          transform:
            `translate(
              ${midX}px,
              ${midY}px
            )
            rotate(${rotate*.55}deg)
            scale(${1+(1-scale)*.4})`,

          opacity:1,

          offset:.52
        },

        {
          transform:
            `translate(
              ${dx}px,
              ${dy}px
            )
            rotate(${rotate}deg)
            scale(${scale})`,

          opacity:
            fade
              ?.15
              :1,

          offset:1
        }

      ],

      {

        duration,

        easing:
          "cubic-bezier(.22,.8,.25,1)",

        fill:
          "forwards"

      }
    );


  try{

    await animation.finished;

  }

  catch(error){}


  clone.remove();

}


/*
  Небольшое мягкое
  приземление.
*/

async function settleCard(selector){

  const card=
    document.querySelector(
      selector
    );


  if(!card){

    return;

  }


  card.animate(
    [

      {
        transform:
          getComputedStyle(
            card
          ).transform
      },

      {
        transform:
          `${getComputedStyle(card).transform}
          translateY(4px)
          scale(.985)`,

        offset:.55
      },

      {
        transform:
          getComputedStyle(
            card
          ).transform
      }

    ],

    {

      duration:190,

      easing:
        "cubic-bezier(.2,.8,.2,1)"

    }
  );


  await sleep(
    130
  );

}


/*
  Забрать / Бито
  каскадом.
*/

async function cascadeTableTo(
  target,
  mode="take"
){

  const cards=

    [
      ...
      document.querySelectorAll(
        "#table .card"
      )
    ];


  if(
    !cards.length
  ){

    return;

  }


  const flights=

    cards.map(
      (
        card,
        index
      )=>

        new Promise(
          resolve=>{

            setTimeout(
              async()=>{

                await arcFlight(
                  card,
                  target,
                  {

                    duration:
                      mode==="discard"
                        ?560
                        :600,

                    lift:
                      mode==="discard"
                        ?55
                        :75,

                    rotate:

                      (
                        index%2
                          ?1
                          :-1
                      )

                      *

                      (
                        mode==="discard"
                          ?10
                          :7
                      ),

                    scale:
                      mode==="discard"
                        ?.72
                        :.82,

                    fade:
                      mode==="discard"

                  }
                );


                resolve();

              },

              index*85
            );

          }
        )

    );


  await Promise.all(
    flights
  );

}


async function animateCpuCardToTable(){

  const source=

    $("cpuHand")
      .querySelector(
        ".card"
      );


  if(!source){

    return;

  }


  await arcFlight(
    source,
    $("table"),
    {

      duration:610,

      lift:95,

      rotate:-5,

      scale:.98

    }
  );

}


async function animatePlayerCardToTable(
  element
){

  await arcFlight(
    element,
    $("table"),
    {

      duration:620,

      lift:78,

      rotate:5,

      scale:.98

    }
  );

}


/*
  Добор из колоды.
*/

async function animateDealTo(
  targetId,
  count
){

  if(!count){

    return;

  }


  const target=
    $(targetId);


  for(
    let i=0;
    i<count;
    i++
  ){

    const source=

      $("deckCard")
        .querySelector(
          ".card"
        )

      ||

      $("deckTrump")
        .querySelector(
          ".card"
        );


    if(!source){

      break;

    }


    arcFlight(
      source,
      target,
      {

        duration:560,

        lift:70,

        rotate:
          (
            i%2
              ?1
              :-1
          )
          *
          4,

        scale:.8

      }
    );


    sound(
      "play"
    );


    await sleep(
      115
    );

  }


  await sleep(
    280
  );

}


/* DRAW */

function drawToSix(hand){

  const before=
    hand.length;


  while(
    hand.length<6
    &&
    deck.length
  ){

    hand.push(
      deck.shift()
    );

  }


  return (
    hand.length
    -
    before
  );

}


async function refill(
  callback
){

  const first=

    attacker==="player"

      ?

        player

      :

        cpu;


  const second=

    attacker==="player"

      ?

        cpu

      :

        player;


  const firstId=

    attacker==="player"

      ?

        "playerHand"

      :

        "cpuHand";


  const secondId=

    attacker==="player"

      ?

        "cpuHand"

      :

        "playerHand";


  const firstCount=
    drawToSix(
      first
    );


  const secondCount=
    drawToSix(
      second
    );


  render();


  locked=
    true;


  renderAction();


  await animateDealTo(
    firstId,
    firstCount
  );


  await animateDealTo(
    secondId,
    secondCount
  );


  locked=
    false;


  render();


  checkGameEnd();


  if(callback){

    callback();

  }

}


/* START */

function lowestTrump(hand){

  return hand

    .filter(
      card=>
        card.suit===trump
    )

    .sort(
      (a,b)=>
        value(a)
        -
        value(b)
    )[0];

}


function startGame(){

  if(
    audioCtx
    &&
    audioCtx.resume
  ){

    audioCtx.resume();

  }


  deck=
    shuffle(
      createDeck()
    );


  bottomTrump=
    deck[
      deck.length-1
    ];


  trump=
    bottomTrump.suit;


  player=[];

  cpu=[];

  table=[];


  discardCount=0;


  defenderTaking=
    false;


  gameOver=
    false;


  locked=
    false;


  for(
    let i=0;
    i<6;
    i++
  ){

    player.push(
      deck.shift()
    );


    cpu.push(
      deck.shift()
    );

  }


  const playerTrump=
    lowestTrump(
      player
    );


  const cpuTrump=
    lowestTrump(
      cpu
    );


  if(
    playerTrump
    &&
    cpuTrump
  ){

    attacker=

      value(playerTrump)
      <=
      value(cpuTrump)

        ?

          "player"

        :

          "cpu";

  }

  else if(
    playerTrump
  ){

    attacker=
      "player";

  }

  else if(
    cpuTrump
  ){

    attacker=
      "cpu";

  }

  else{

    attacker=

      Math.random()<.5

        ?

          "player"

        :

          "cpu";

  }


  defender=

    attacker==="player"

      ?

        "cpu"

      :

        "player";


  defenderStartCards=

    (
      defender==="player"

        ?

          player

        :

          cpu
    )
    .length;


  $("startScreen")
    .classList
    .add(
      "hidden"
    );


  $("resultOverlay")
    .classList
    .add(
      "hidden"
    );


  render();


  if(
    attacker==="cpu"
  ){

    setTimeout(
      cpuAttack,
      650
    );

  }

}


/* PLAYER */

async function playerCardClick(
  id,
  element
){

  const card=

    player.find(
      card=>
        card.id===id
    );


  if(
    !card
    ||
    !canPlayerPlay(
      card
    )
  ){

    return;

  }


  locked=
    true;


  renderAction();


  sound(
    "play"
  );


  /*
    Сначала карта
    красиво долетает.
  */

  await animatePlayerCardToTable(
    element
  );


  /*
    Потом меняем
    состояние игры.
  */

  if(
    attacker==="player"
  ){

    table.push({

      attack:
        removeCard(
          player,
          id
        ),

      defense:null

    });


    render();


    await settleCard(
      "#table .pair:last-child .card:first-child"
    );


    if(
      !defenderTaking
    ){

      setTimeout(
        cpuDefend,
        260
      );

    }

    else{

      locked=
        false;


      render();

    }


    return;

  }


  const pair=

    table.find(
      pair=>
        !pair.defense
    );


  if(
    !pair
    ||
    !beats(
      card,
      pair.attack
    )
  ){

    locked=
      false;


    render();


    return;

  }


  pair.defense=

    removeCard(
      player,
      id
    );


  sound(
    "beat"
  );


  render();


  await settleCard(
    "#table .pair:last-child .card.defense"
  );


  setTimeout(
    cpuContinueAttack,
    260
  );

}


/* CPU */

function cheapest(cards){

  return [
    ...cards
  ].sort(
    (a,b)=>{

      const aTrump=
        a.suit===trump;


      const bTrump=
        b.suit===trump;


      if(
        aTrump!==bTrump
      ){

        return (
          aTrump
            ?1
            :-1
        );

      }


      return (
        value(a)
        -
        value(b)
      );

    }
  )[0];

}


function cpuShouldTake(
  attack
){

  const possible=

    cpu.filter(
      card=>
        beats(
          card,
          attack
        )
    );


  if(
    !possible.length
  ){

    return true;

  }


  const cheapestDefense=
    cheapest(
      possible
    );


  const usesTrump=

    cheapestDefense.suit===
      trump

    &&

    attack.suit!==
      trump;


  const highTrump=

    usesTrump

    &&

    value(
      cheapestDefense
    )
    >=
    ranks.indexOf(
      "Q"
    );


  if(
    cpu.length<=3
  ){

    return false;

  }


  return (

    usesTrump

    &&

    highTrump

    &&

    value(attack)
      <=
      ranks.indexOf(
        "9"
      )

    &&

    table.length>=2

  );

}


async function cpuDefend(){

  if(
    defender!=="cpu"
    ||
    defenderTaking
  ){

    return;

  }


  const pair=

    table.find(
      pair=>
        !pair.defense
    );


  if(!pair){

    return;

  }


  if(
    cpuShouldTake(
      pair.attack
    )
  ){

    defenderTaking=
      true;


    locked=
      false;


    render();


    return;

  }


  const possible=

    cpu.filter(
      card=>
        beats(
          card,
          pair.attack
        )
    );


  if(
    !possible.length
  ){

    defenderTaking=
      true;


    locked=
      false;


    render();


    return;

  }


  const defense=
    cheapest(
      possible
    );


  await animateCpuCardToTable();


  pair.defense=

    removeCard(
      cpu,
      defense.id
    );


  sound(
    "beat"
  );


  render();


  await settleCard(
    "#table .pair:last-child .card.defense"
  );


  locked=
    false;


  render();

}


async function cpuAttack(){

  if(
    attacker!=="cpu"
    ||
    gameOver
  ){

    return;

  }


  const possible=

    cpu.filter(
      canAttack
    );


  if(
    !possible.length
  ){

    if(
      table.length
    ){

      successfulDefense();

    }


    return;

  }


  locked=
    true;


  renderAction();


  const attack=
    cheapest(
      possible
    );


  await animateCpuCardToTable();


  table.push({

    attack:
      removeCard(
        cpu,
        attack.id
      ),

    defense:null

  });


  sound(
    "play"
  );


  render();


  await settleCard(
    "#table .pair:last-child .card:first-child"
  );


  locked=
    false;


  render();

}


async function cpuContinueAttack(){

  if(
    attacker!=="cpu"
    ||
    gameOver
  ){

    return;

  }


  if(
    defenderTaking
  ){

    const possible=

      cpu.filter(
        canAttack
      );


    if(
      possible.length
    ){

      const nonTrump=

        possible.filter(
          card=>
            card.suit!==trump
        );


      const attack=

        cheapest(
          nonTrump.length

            ?

              nonTrump

            :

              possible
        );


      locked=
        true;


      renderAction();


      await animateCpuCardToTable();


      table.push({

        attack:
          removeCard(
            cpu,
            attack.id
          ),

        defense:null

      });


      sound(
        "play"
      );


      render();


      await settleCard(
        "#table .pair:last-child .card:first-child"
      );


      locked=
        false;


      render();


      setTimeout(
        cpuContinueAttack,
        220
      );

    }

    else{

      finishTake();

    }


    return;

  }


  const possible=

    cpu.filter(
      canAttack
    );


  const nonTrump=

    possible.filter(
      card=>
        card.suit!==trump
    );


  const shouldPress=

    player.length<=3

    ||

    table.length<2;


  if(
    possible.length

    &&

    table.length<
      maxAttacks()

    &&

    shouldPress
  ){

    const attack=

      cheapest(
        nonTrump.length

          ?

            nonTrump

          :

            possible
      );


    locked=
      true;


    renderAction();


    await animateCpuCardToTable();


    table.push({

      attack:
        removeCard(
          cpu,
          attack.id
        ),

      defense:null

    });


    sound(
      "play"
    );


    render();


    await settleCard(
      "#table .pair:last-child .card:first-child"
    );


    locked=
      false;


    render();

  }

  else{

    successfulDefense();

  }

}


/* TAKE */

function playerTake(){

  if(
    defender!=="player"
    ||
    locked
  ){

    return;

  }


  defenderTaking=
    true;


  locked=
    true;


  sound(
    "take"
  );


  render();


  setTimeout(
    cpuContinueAttack,
    260
  );

}


function collectTable(hand){

  for(
    const pair
    of table
  ){

    hand.push(
      pair.attack
    );


    if(
      pair.defense
    ){

      hand.push(
        pair.defense
      );

    }

  }


  table=[];

}


async function finishTake(){

  if(gameOver){

    return;

  }


  const hand=

    defender==="player"

      ?

        player

      :

        cpu;


  const target=

    defender==="player"

      ?

        $("playerHand")

      :

        $("cpuHand");


  locked=
    true;


  renderAction();


  /*
    Карты улетают
    по одной каскадом.
  */

  await cascadeTableTo(
    target,
    "take"
  );


  collectTable(
    hand
  );


  defenderTaking=
    false;


  await refill(
    ()=>{

      defenderStartCards=

        (
          defender==="player"

            ?

              player

            :

              cpu
        )
        .length;


      render();


      if(
        !gameOver
        &&
        attacker==="cpu"
      ){

        setTimeout(
          cpuAttack,
          420
        );

      }

    }
  );

}


/* БИТО */

async function successfulDefense(){

  if(
    !table.length
    ||
    gameOver
  ){

    return;

  }


  const discarded=

    table.reduce(
      (
        total,
        pair
      )=>

        total
        +
        1
        +
        (
          pair.defense
            ?1
            :0
        ),

      0
    );


  locked=
    true;


  renderAction();


  /*
    Мягко уводим
    карты в Бито.
  */

  await cascadeTableTo(
    $("discard"),
    "discard"
  );


  discardCount+=
    discarded;


  table=[];


  [
    attacker,
    defender
  ]=
  [
    defender,
    attacker
  ];


  defenderTaking=
    false;


  await refill(
    ()=>{

      defenderStartCards=

        (
          defender==="player"

            ?

              player

            :

              cpu
        )
        .length;


      render();


      if(
        !gameOver
        &&
        attacker==="cpu"
      ){

        setTimeout(
          cpuAttack,
          420
        );

      }

    }
  );

}


/* END */

function checkGameEnd(){

  if(
    deck.length
  ){

    return;

  }


  if(
    player.length===0
    ||
    cpu.length===0
  ){

    gameOver=
      true;


    locked=
      true;


    render();


    setTimeout(
      showResult,
      250
    );

  }

}


function showResult(){

  if(
    player.length===0
    &&
    cpu.length===0
  ){

    $("resultIcon")
      .textContent=
        "🤝";


    $("resultTitle")
      .textContent=
        "Ничья";


    $("resultText")
      .textContent=
        "Карты закончились одновременно.";

  }

  else if(
    player.length===0
  ){

    $("resultIcon")
      .textContent=
        "🏆";


    $("resultTitle")
      .textContent=
        "Ты выиграл";


    $("resultText")
      .textContent=
        "У тебя не осталось карт.";

  }

  else{

    $("resultIcon")
      .textContent=
        "🃏";


    $("resultTitle")
      .textContent=
        "Ты дурак";


    $("resultText")
      .textContent=
        "Компьютер избавился от карт раньше.";

  }


  $("resultOverlay")
    .classList
    .remove(
      "hidden"
    );

}


/* EVENTS */

$("playerHand")
  .addEventListener(
    "click",
    event=>{

      const element=

        event.target.closest(
          ".card[data-id]"
        );


      if(element){

        playerCardClick(
          element.dataset.id,
          element
        );

      }

    }
  );


$("startButton")
  .onclick=
    startGame;


$("againButton")
  .onclick=
    startGame;


render();

</script>
